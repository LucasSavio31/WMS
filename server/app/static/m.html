// ======================================================================= LER ETIQUETA
// Só lê: aperte o gatilho perto das etiquetas e veja o EPC de cada uma.
// Fabricantes de chip (MDID do TID, padrão GS1/EPCglobal) e chips mais comuns (TMN):
// nome, EPC máximo e memória de usuário em bits.
const FABRICANTES = { 0x001: "Impinj", 0x002: "Texas Instruments", 0x003: "Alien Technology", 0x004: "Intelleflex",
  0x005: "Atmel", 0x006: "NXP", 0x007: "ST Microelectronics", 0x008: "EP Microelectronics", 0x00A: "Sentech",
  0x00B: "EM Microelectronic", 0x00C: "Renesas", 0x00F: "Quanray", 0x010: "Fujitsu", 0x018: "Ceitec" };
const CHIPS = {
  "001-100": ["Monza 4D", 128, 32], "001-105": ["Monza 4QT", 128, 512], "001-10C": ["Monza 4E", 496, 128],
  "001-130": ["Monza 5", 128, 32], "001-160": ["Monza R6", 96, 0], "001-170": ["Monza R6-P", 128, 64],
  "001-190": ["M730", 128, 0], "001-191": ["M750", 96, 32],
  "006-810": ["UCODE 7", 128, 0], "006-894": ["UCODE 8", 128, 0], "006-915": ["UCODE 9", 96, 0],
  "003-412": ["Higgs-3", 480, 512], "003-414": ["Higgs-4", 128, 128], "003-811": ["Higgs-9", 496, 688],
};
const bitsBytes = (b) => `${b} bits (${b / 8} bytes)`;
/** TID classe E2 (Gen2): 8 bits E2, 12 bits (XTID/S/F + MDID de 9 bits), 12 bits TMN (modelo). */
function chipDoTid(tid) {
  if (!/^E2[0-9A-F]{6}/i.test(tid || "")) return null;
  const mdid = parseInt(tid.slice(2, 5), 16) & 0x1FF, tmn = parseInt(tid.slice(5, 8), 16);
  const chave = mdid.toString(16).toUpperCase().padStart(3, "0") + "-" + tmn.toString(16).toUpperCase().padStart(3, "0");
  const fab = FABRICANTES[mdid] || `fabricante 0x${mdid.toString(16).toUpperCase()}`;
  const c = CHIPS[chave];
  return c ? { nome: `${fab} ${c[0]}`, epcMax: c[1], user: c[2] } : { nome: `${fab}, modelo 0x${tmn.toString(16).toUpperCase().padStart(3, "0")}` };
}
window.detalheEtiqueta = (json) => { try { telas.ler.detalhe(JSON.parse(json)); } catch {} };

telas.ler = {
  titulo: "Ler etiqueta",
  abrir() {
    this.detalhes = new Map();   // EPC -> detalhes vindos do app (TID, PC, região)
    try { app?.detalharEtiquetas?.(true); } catch {}
    this.lidas = new Map();   // EPC -> quantas vezes o leitor viu
    tela.innerHTML = `<div class="card"><p class="fraco" style="margin:0"><b>Só para verificação</b>: aperte o gatilho perto da etiqueta
        e o EPC aparece aqui. Nada é gravado, baixado nem enviado ao sistema.</p></div>
      <div class="card"><h2>Etiquetas lidas <span class="dir"><span class="contador" id="lrCont">0</span></span></h2>
        <ul class="lista" id="lrLista"></ul>
        <div class="botoes" style="margin-top:8px"><button class="b" data-acao="limpar">Limpar</button></div></div>`;
    this.desenhar();
  },
  rfid(epc) {
    const vezes = (this.lidas.get(epc) || 0) + 1;
    this.lidas.delete(epc);        // a última lida vai para o topo da lista
    this.lidas.set(epc, vezes);
    if (vezes === 1) bipe("ok");   // bipe só na primeira vez que a etiqueta aparece
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.desenhar(), 80);
  },
  desenhar() {
    if (!$("lrLista")) return;
    $("lrCont").textContent = this.lidas.size;
    $("lrLista").innerHTML = [...this.lidas].reverse().map(([epc, n]) => `<li>
        <div class="info"><div class="mono" style="font-size:17px;font-weight:700;word-break:break-all">${esc(epc)}</div>
          <div class="fraco">${epc.length} dígitos · lida ${n} vez(es)</div>
          ${this.htmlDetalhe(epc)}</div></li>`).join("")
      || `<li class="vazio">Nenhuma etiqueta lida ainda</li>`;
  },
  /** Tipo e frequência, tamanho do EPC, chip e memória (pelo TID lido pelo app). */
  htmlDetalhe(epc) {
    const linha = (rotulo, valor) => `<div style="font-size:13px"><span class="fraco">${rotulo}:</span> ${valor}</div>`;
    let h = linha("Tipo", "UHF RFID · EPC Gen2 (860–960 MHz)");
    const d = this.detalhes.get(epc);
    if (!d) return h + (app ? '<div class="fraco" style="font-size:12px">Detalhes da memória ao soltar o gatilho…</div>' : "");
    if (d.canais || d.regiao) h += linha("Leitor", esc([d.regiao, d.canais].filter(Boolean).join(" · ")));
    if (d.epcBits) h += linha("EPC gravado", bitsBytes(d.epcBits));
    const chip = chipDoTid(d.tid);
    if (chip) {
      h += linha("Chip", esc(chip.nome));
      if (chip.epcMax !== undefined) {
        const tidBits = d.tid.length * 4;
        h += linha("Memória", `EPC até ${bitsBytes(chip.epcMax)} · usuário ${bitsBytes(chip.user)} · TID ${tidBits} bits`);
      }
    }
    if (d.tid) h += `<div class="mono fraco" style="font-size:12px;word-break:break-all">TID ${esc(d.tid)}</div>`;
    else h += '<div class="fraco" style="font-size:12px">TID não lido (aproxime e leia de novo)</div>';
    return h;
  },
  detalhe(d) {
    if (!d?.epc) return;
    if (d.tid || !this.detalhes.get(d.epc)?.tid) this.detalhes.set(d.epc, d);   // não troca um TID lido por um vazio
    this.desenhar();
  },
  limpar() {
    this.lidas.clear(); this.detalhes.clear(); this.desenhar();
    try { app?.detalharEtiquetas?.(false); app?.detalharEtiquetas?.(true); } catch {}   // lê o TID de novo
  },
  codigo(c) { msg("Código de barras: " + c, "info"); },
};

// ======================================================================= LEITOR DO PC
// O PC comanda: esta tela pergunta ao servidor por comandos (ler, parar, gravar, limpar),
// executa no leitor RFID e devolve as leituras. O gatilho também lê. Deixe a tela aberta.
telas.remoto = {
  titulo: "Leitor do PC",
  abrir() {
    this.apos = null; this.enviadas = new Set(); this.buffer = []; this.n = 0;
    tela.innerHTML = `<div class="card" style="text-align:center"><div style="font-size:48px;line-height:1.1">🖥️</div>
        <h2 style="justify-content:center">Leitor do PC</h2>
        <div id="rmEstado" style="font-size:17px;font-weight:600">Conectando ao servidor…</div></div>
      <div class="card"><h2>Etiquetas lidas <span class="dir"><span class="contador" id="rmCont">0</span></span></h2>
        <div class="mono fraco" id="rmUltima" style="word-break:break-all">—</div></div>
      <p class="fraco" style="text-align:center;padding:0 12px">Deixe esta tela aberta: o PC (menu <b>Leitor remoto</b>) manda ler e gravar.
        O gatilho também lê.</p>`;
    try { app?.manterTelaLigada?.(true); } catch {}
    clearInterval(this.timer);
    this.timer = setInterval(() => this.buscar(), 400);
    this.buscar();
  },
  sair() {
    clearInterval(this.timer); this.timer = null;
    clearTimeout(this.fimLeitura); this.pararBipe();
    this.lerLigado(false);
    try { app?.manterTelaLigada?.(false); } catch {}
  },
  estado(t) { if ($("rmEstado")) $("rmEstado").textContent = t; },
  lerLigado(ligar) { try { app?.lerContinuo?.(ligar); } catch {} },
  async buscar() {
    if (this.buscando) return;
    this.buscando = true;
    try {
      const r = await api("GET", "/api/remoto/comandos?apos=" + (this.apos ?? -1));
      if (telaAtual !== "remoto") return;
      if (this.apos === null) {   // começa do último comando (não executa comandos antigos)
        this.apos = r.ultimo;
        this.estado(app?.lerContinuo ? "Pronto: aguardando o PC" : "Atualize o ColetorWMS.apk para usar o Leitor do PC");
        return;
      }
      for (const c of r.comandos) { this.apos = c.id; this.executar(c); }
      if (this.semRede) { this.semRede = false; this.estado("Pronto: aguardando o PC"); }
    } catch {
      this.semRede = true;
      this.estado("Sem conexão com o servidor");
    } finally {
      this.buscando = false;
    }
  },
  executar(c) {
    if (c.acao === "ler") {
      definirPotencia(c.potencia || potenciaDaTela("remoto"));
      clearTimeout(this.fimLeitura);
      this.lerLigado(true); this.lendoPC = true;
      this.estado(c.ms > 0 ? `Lendo por ${c.ms / 1000} s (comando do PC)…` : "Lendo até o PC mandar parar…");
      if (c.ms > 0) this.fimLeitura = setTimeout(() => this.parar(), c.ms);
    } else if (c.acao === "parar") {
      if (this.bipando) this.voltarRfid();
      this.parar();
    } else if (c.acao === "limpar") {
      this.enviadas.clear(); this.n = 0;
      if ($("rmCont")) { $("rmCont").textContent = "0"; $("rmUltima").textContent = "—"; }
    } else if (c.acao === "bipar") {
      clearTimeout(this.fimLeitura);
      this.lerLigado(false);
      if (!app?.escanearCodigo) return this.evento("codigo", { erro: "Atualize o ColetorWMS.apk" });
      definirGatilho("barras");   // liga o leitor de código de barras do DataWedge
      this.estado("Aponte para o código de barras (comando do PC)…");
      // Mantém o leitor acionado até ler: espera o DataWedge ligar o scanner e redispara o feixe
      // a cada 3 s, até chegar um código, o PC mandar parar ou passar 30 s.
      this.pararBipe();
      this.bipando = true;
      const disparar = () => {
        if (!this.bipando) return;
        try { app.escanearCodigo(); } catch {}
        this.timerBipe = setTimeout(disparar, 3000);
      };
      this.timerBipe = setTimeout(disparar, 700);
      this.fimBipe = setTimeout(() => this.voltarRfid(), 30000);
    } else if (c.acao === "gravar") {
      clearTimeout(this.fimLeitura);
      this.lerLigado(false);
      if (!app?.gravarEtiqueta) return this.evento("gravacao", { ok: false, mensagem: "Atualize o ColetorWMS.apk" });
      this.estado(`Gravando ${c.texto}: encoste o coletor na etiqueta…`);
      app.gravarEtiqueta(c.texto, c.potencia || cfg.potGravar || 30);
    }
  },
  parar() {
    clearTimeout(this.fimLeitura);
    this.lerLigado(false); this.lendoPC = false;
    definirPotencia(potenciaDaTela("remoto"));
    this.estado("Pronto: aguardando o PC");
    this.evento("parou", {});
  },
  evento(tipo, dados) { api("POST", "/api/remoto/evento", { tipo, dados }).catch(() => {}); },
  async resultadoGravacao(r) {
    bipe(r.ok ? "ok" : "alerta");
    this.estado(r.ok ? `✓ Gravado: ${r.novo}` : r.mensagem);
    if (r.ok) {   // o cadastro da etiqueta passa a usar o EPC novo
      try { const x = await api("POST", "/api/tags/regravar", { antigo: r.antigo, novo: r.novo }); r.cadastro = x.atualizado ? x.sku : null; }
      catch (e) { r.cadastroErro = e.message; }
    }
    this.evento("gravacao", r);
  },
  rfid(epc) {
    // Toda leitura vai para o PC (a coluna Vezes vai subindo); bipe só na primeira vez de cada etiqueta
    if (!this.enviadas.has(epc)) {
      this.enviadas.add(epc); this.n++;
      bipe("ok");
      if ($("rmCont")) $("rmCont").textContent = this.n;
    }
    if ($("rmUltima")) $("rmUltima").textContent = epc;
    this.buffer.push(epc);
    // Envia a cada 0,25 s enquanto houver leituras (não espera o leitor parar): o PC vê ao vivo
    if (!this.timerEnvio) this.timerEnvio = setTimeout(() => this.enviar(), 250);
  },
  async enviar() {
    this.timerEnvio = null;
    const epcs = this.buffer; this.buffer = [];
    if (!epcs.length) return;
    try { await api("POST", "/api/remoto/leituras", { epcs }); }
    catch { epcs.forEach((e) => this.enviadas.delete(e)); }   // sem rede: pode ler de novo
  },
  /** Código de barras lido (comando "bipar" do PC ou gatilho): vai para o campo Gravar do PC. */
  codigo(c) {
    bipe("ok");
    this.evento("codigo", { codigo: c });
    if (this.bipando) this.voltarRfid();
    this.estado(`Código lido: ${c}`);
  },
  pararBipe() {
    this.bipando = false;
    clearTimeout(this.timerBipe); clearTimeout(this.fimBipe); this.fimBipe = null;
  },
  voltarRfid() {
    this.pararBipe();
    definirGatilho("rfid");   // desliga o scanner do DataWedge (o feixe apaga) e volta ao RFID
    setTimeout(() => { if (telaAtual === "remoto" && !this.lendoPC) this.estado("Pronto: aguardando o PC"); }, 1500);
  },
};

// ======================================================================= GRAVAR
// Regrava o EPC de uma etiqueta: o código (bipado ou digitado) vira o novo EPC.
telas.gravar = {
  titulo: "Gravar etiqueta",
  gatilho: "barras",   // nesta tela o gatilho lê código de barras
  abrir() {
    tela.innerHTML = `<div class="card">
        <label class="campo"><span>Código a gravar na etiqueta</span>
          <input id="grCodigo" class="mono" autocomplete="off" autocapitalize="characters" spellcheck="false"
                 enterkeyhint="done" data-enter="previa" placeholder="Bipe o código de barras ou digite"></label>
        <div class="fraco" id="grPrevia" style="margin-top:6px"></div></div>
      <div class="card"><p class="fraco" style="margin:0 0 8px">Encoste o coletor na etiqueta (só ela perto) e toque em
          <b>Gravar</b>. O código substitui o EPC da etiqueta.</p>
        <div class="botoes"><button class="b" data-acao="limpar">Limpar</button>
          <button class="b primario" data-acao="gravar" id="grBotao">📝 Gravar</button></div></div>
      <div id="grResultado"></div>`;
    const c = $("grCodigo");
    c.addEventListener("focus", () => definirGatilho("barras"));   // cursor no campo: gatilho lê código de barras
    c.addEventListener("input", () => this.previa());
    this.previa();
  },
  texto() { return ($("grCodigo")?.value || "").trim().toUpperCase(); },
  previa() {
    const v = this.texto(), el = $("grPrevia");
    if (!el) return;
    if (!v) { el.textContent = "O EPC tem 24 dígitos; código menor é completado com 0 à esquerda."; return; }
    if (!/^[0-9A-F]+$/.test(v)) { el.innerHTML = '<b style="color:var(--alerta)">Só números e letras de A a F</b>'; return; }
    if (v.length > 24) { el.innerHTML = '<b style="color:var(--alerta)">No máximo 24 caracteres</b>'; return; }
    const exato = v.padStart(Math.ceil(v.length / 4) * 4, "0");
    el.innerHTML = `Vai gravar: <b class="mono">${esc(exato)}</b> (${exato.length} dígitos)` +
      (exato.length < 24 ? `<br>Se a etiqueta não aceitar menos dígitos: <span class="mono">${esc(v.padStart(24, "0"))}</span>` : "");
  },
  /** Código de barras (com o campo focado ou não): fica fixado no campo, substituindo o anterior. */
  codigo(d) {
    const c = $("grCodigo");
    if (!c) return;
    c.value = d; c.dataset.antes = d;
    bipe("ok");
    this.previa();
  },
  rfid(d) { this.codigo(d); },   // código de barras hexadecimal comprido parece EPC: trata igual
  limpar() {
    $("grCodigo").value = ""; $("grCodigo").dataset.antes = "";
    $("grResultado").innerHTML = "";
    this.previa();
  },
  gravar(b) {
    const v = this.texto();
    if (!v) return msg("Bipe ou digite o código", "info");
    if (!/^[0-9A-F]{1,24}$/.test(v)) return msg("O código tem que ter até 24 caracteres, só números e letras de A a F", "info");
    if (!app?.gravarEtiqueta) return msg("A gravação só funciona no app do coletor (atualize o ColetorWMS.apk)", "info");
    this.botao = b; b.disabled = true; b.textContent = "Gravando…";
    $("grResultado").innerHTML = "";
    msg("Gravando: mantenha o coletor encostado na etiqueta", "info", false);
    try { app.gravarEtiqueta(v, cfg.potGravar || 30); } catch (e) { this.fim(); msg(e.message, "info"); }
  },
  fim() { if (this.botao) { this.botao.disabled = false; this.botao.textContent = "📝 Gravar"; } },
  async resultado(r) {
    this.fim();
    if (!r.ok) { bipe("alerta"); msg(r.mensagem, "info", false); return; }
    bipe("ok");
    let cadastro = "";
    if (LOCAL) cadastro = '<div class="fraco" style="margin-top:6px">Sem servidor: se esta etiqueta estava no estoque, o cadastro continua com o EPC antigo.</div>';
    else try {
      const s = await api("POST", "/api/tags/regravar", { antigo: r.antigo, novo: r.novo });
      if (s.atualizado) cadastro = `<div class="fraco" style="margin-top:6px">Cadastro atualizado: ${esc(s.sku)} agora usa o EPC novo.</div>`;
    } catch (e) { cadastro = `<div class="fraco" style="margin-top:6px">${esc(e.message)}</div>`; }
    if (telaAtual !== "gravar") return;
    $("grResultado").innerHTML = `<div class="card"><h2>✓ Etiqueta gravada</h2>
        <div class="fraco">Antes</div><div class="mono">${esc(r.antigo)}</div>
        <div class="fraco" style="margin-top:6px">Agora</div><div class="mono"><b>${esc(r.novo)}</b></div>${cadastro}</div>`;
    msg("✓ Etiqueta gravada", "ok", false);
  },
};

    });
    $("cfVolume").addEventListener("change", () => bipe("ok"));
    tela.querySelectorAll("[data-pot]").forEach((r) => r.addEventListener("input", () => {
      cfg[r.dataset.pot] = Number(r.value); salvarCfg();
      $(r.dataset.pot + "Txt").textContent = r.value + "%";
    }));
  },
  testar() { bipe("ok"); },
  procurar() {
    if (window.ColetorApp?.procurarServidor) window.ColetorApp.procurarServidor();
    else if (app) msg("Atualize o ColetorWMS.apk para procurar o servidor", "info");
    else msg("A busca na rede é feita pelo app do coletor", "info");
  },
  digitar() {
    if (window.ColetorApp) window.ColetorApp.servidor();   // popup nativo do app (guarda o endereço)
    else configurarServidor();
  },
};

  if (!LOCAL) try { await carregarApoio(); } catch (e) { msg(e.message, "erro"); }
  abrir(location.hash.slice(1) || "menu");
  if (!LOCAL) setInterval(() => carregarApoio().catch(() => {}), 60000);
})();
</script>
