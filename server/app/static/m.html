<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="light dark">
<title>WMS Coletor</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icone.svg">
<!--
  Tela do coletor pelo navegador (Zebra MC3390R / MC3330R com Chrome).

  Como as leituras chegam aqui:
    DataWedge (perfil associado ao Chrome) com "Barcode input" e "RFID input"
    ligados e "Keystroke output" mandando os dados + ENTER. Ou seja, o
    DataWedge "digita" cada código de barras e cada EPC lido.

  A página guarda as leituras no campo "Leitura" (sem teclado virtual) e,
  se o dado cair em outro campo (ex.: Lote), percebe que veio do leitor
  (chegou de uma vez ou muito rápido) e tira de lá.

  Classificação da leitura:
    - EPC RFID ....: hexadecimal com 16 ou mais caracteres
    - Endereço ....: igual ao código de um endereço cadastrado (etiqueta da prateleira)
    - Produto .....: qualquer outra coisa (EAN ou SKU)

  Toda regra (FEFO, saldo, validade, data/hora) continua no servidor.

  Telas: Recebimento (ordens do PC), Entrada (sem ordem), Baixa (automática), Inventário e Localizar.

  Dentro do app "Coletor WMS" (Android, pasta coletor/):
    - o RFID é lido pelo app (SDK Zebra) e chega aqui por leituraRfid(epc);
    - a página fala com o app pelo objeto ColetorApp: gatilhoRfid(true/false)
      escolhe o que o gatilho lê e potencia(%) ajusta a antena;
    - o código de barras continua vindo pelo DataWedge.

  Tela do coletor:
    - Tela cheia: no primeiro toque a página esconde a barra de endereços do
      Chrome (opção no botão ⚙). Instalada como app ("Adicionar à tela
      inicial" com a origem liberada no chrome://flags) já abre sem a barra.
    - Teclado virtual: fica escondido enquanto só se lê com o gatilho. Aparece
      nos campos de digitação (lote, quantidade...) e no botão ⌨.
-->
<style>
  :root {
    --bg: #eef1f5; --painel: #fff; --borda: #d8dee6; --texto: #17202b; --texto-2: #5c6778;
    --topo: #16263a; --primaria: #1f6feb; --perigo: #c62828; --sucesso: #2e7d32; --alerta: #b26a00;
    --fundo-perigo: #fdecea; --fundo-sucesso: #e8f5e9; --fundo-alerta: #fff4e0; --fundo-info: #e3f2fd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1520; --painel: #172130; --borda: #2a3748; --texto: #e4eaf2; --texto-2: #9aa8ba; --topo: #0b111a;
            --primaria: #3d8bfd; --perigo: #ef5350; --sucesso: #66bb6a; --alerta: #ffb74d;
            --fundo-perigo: #3a1d1f; --fundo-sucesso: #1b3320; --fundo-alerta: #3a2c14; --fundo-info: #13304a; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  body { background: var(--bg); color: var(--texto); font: 15px/1.35 Roboto, "Segoe UI", system-ui, Arial, sans-serif; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }

  header { background: var(--topo); color: #fff; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px; min-height: 50px; flex: none; }
  header h1 { font-size: 15px; line-height: 1.15; margin: 0; flex: 1; min-width: 0; font-weight: 600; }   /* quebra entre palavras em vez de cortar */
  header button { background: none; border: none; color: #fff; font-size: 22px; width: 40px; height: 42px; border-radius: 50%; flex: none; padding: 0; }
  header #voltar { width: 28px; margin: 0 -4px 0 -2px; }   /* logo fica sempre na borda esquerda; a seta vem depois */
  header button:active { background: #ffffff22; }
  /* Barra de status (hora, Wi-Fi, bateria): só em tela cheia, quando o Android esconde a dele */
  .status { display: none; align-items: center; gap: 10px; height: 24px; padding: 0 10px; background: #000; color: #fff; font: 600 13px Roboto, Arial, sans-serif; flex: none; }
  .status, .status span, .status svg { color: #fff !important; }
  .tela-cheia .status { display: flex; }
  .status .dir { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .status svg { display: block; }
  #bateria { display: flex; align-items: center; gap: 3px; }
  #bateria[hidden] { display: none; }
  .wifi-off .arco { opacity: .25; }
  .status #iconeWifi.baixo { color: #ffb74d !important; }
  .status #iconeWifi.off { color: #ef5350 !important; }
  #btTelaCheia[hidden] { display: none; }

  /* Campo invisível de captura do DataWedge (precisa existir e poder ter foco) */
  .captura { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; resize: none; overflow: hidden; }
  header #modo, header #teclado, header #btConfig { width: 34px; font-size: 18px; border-radius: 8px; }
  .potencia { margin: 8px 0 4px; }
  /* PIN da Config: igual ao do AppCenter (fundo branco, visor com bolinhas, teclado 3x4) */
  dialog.pin { background: #fff; color: #17202b; border: 0; border-radius: 6px; padding: 10px 14px 2px; width: min(280px, 86vw); }
  dialog.pin h3 { font-size: 16px; font-weight: 500; margin: 0 0 2px; color: #17202b; }
  dialog.pin .pin-visor { text-align: center; font-size: 20px; letter-spacing: 8px; min-height: 24px; line-height: 24px; color: #17202b; }
  dialog.pin .pin-teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; margin: 4px 4px 0; }
  dialog.pin .pin-teclado button { height: 36px; border: 0; border-radius: 4px; background: #d6d8da; color: #17202b; font-size: 18px;
                                   box-shadow: 0 1px 2px #0003; }
  dialog.pin .pin-teclado button:active { background: #bfc2c5; }
  dialog.pin .pin-teclado button.ok { background: #1f6feb; color: #fff; border-radius: 8px; }
  dialog.pin .pin-rodape { text-align: right; }
  dialog.pin .pin-rodape button { background: none; border: 0; color: #00897b; font-size: 14px; font-weight: 600; padding: 6px 6px; letter-spacing: .5px; }
  /* Consulta: etiquetas de cada item (abre com um toque) */
  details.etiquetas summary { cursor: pointer; color: var(--primaria); font-size: 14px; margin-top: 4px; }
  details.etiquetas ul { margin: 6px 0 0; padding-left: 18px; }
  details.etiquetas li { font-size: 13px; padding: 2px 0; }
  /* Teclado na tela (o Gboard não mostra as teclas no MC3300 por causa do teclado físico) */
  #tecladoTela { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: #1b2230; padding: 4px 3px 6px;
                 box-shadow: 0 -4px 14px #0006; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #tecladoTela[hidden] { display: none; }
  #tecladoTela .linha { display: flex; gap: 3px; margin-top: 3px; }
  #tecladoTela button { flex: 1; min-width: 0; height: 44px; border: 0; border-radius: 6px; background: #3a4458; color: #fff;
                        font: 600 18px system-ui, sans-serif; padding: 0; }
  #tecladoTela button:active { background: #5b6b8a; }
  #tecladoTela button.esp { background: #283144; font-size: 15px; }
  #tecladoTela button.ok { background: var(--primaria); }
  #tecladoTela.numerico button { height: 52px; font-size: 22px; }
  body.com-teclado main { padding-bottom: 250px; }
  dialog #tecladoTela { position: fixed; }
  dialog[open] { margin: 70px auto auto; }   /* diálogo sempre no topo: não pula quando o teclado abre */
  .potencia .dir { float: right; }
  header #teclado.ligado { background: var(--primaria); }
  header #modo.barras { background: #ffb74d33; }
  header #modo.lendo { background: var(--primaria); animation: pulsa .6s infinite alternate; }
  @keyframes pulsa { to { opacity: .55; } }

  main { flex: 1; overflow-y: auto; padding: 8px 8px 16px; }
  .grade-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; min-height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 15px; color: var(--texto); position: relative; padding: 8px; }
  .tile:active { background: var(--fundo-info); }
  .tile .ic { font-size: 28px; line-height: 1; }
  .tile .badge { position: absolute; top: 6px; right: 8px; background: var(--alerta); color: #fff; border-radius: 10px; font-size: 12px; padding: 0 7px; }
  .tile .badge:empty { display: none; }

  .card { background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-2); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
  .card h2 .dir { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .dica { color: var(--texto-2); text-align: center; padding: 14px 8px; border: 2px dashed var(--borda); border-radius: 10px; font-size: 14px; }
  .dica b { color: var(--texto); }
  .produto { font-size: 16px; font-weight: 700; }
  .fraco { color: var(--texto-2); font-size: 13px; font-weight: 400; }
  .mono { font-family: Consolas, monospace; font-size: 12.5px; word-break: break-all; }

  label.campo { display: block; margin-bottom: 8px; }
  label.campo > span { display: block; font-size: 12px; font-weight: 600; color: var(--texto-2); margin-bottom: 3px; }
  input, select { width: 100%; font: 16px Roboto, "Segoe UI", Arial, sans-serif; padding: 9px 10px; border: 1px solid var(--borda); border-radius: 8px; background: var(--painel); color: var(--texto); min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--primaria); outline-offset: -1px; }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .botoes { display: flex; gap: 8px; margin-top: 4px; }
  .botoes > * { flex: 1; }
  button.b { font: 700 15px Roboto, "Segoe UI", Arial, sans-serif; min-height: 50px; border-radius: 10px; border: 1px solid var(--borda); background: var(--painel); color: var(--texto); padding: 6px 10px; }
  button.b:active { filter: brightness(.92); }
  button.b:disabled { opacity: .45; }
  button.primario { background: var(--primaria); border-color: var(--primaria); color: #fff; }
  button.perigo { background: var(--perigo); border-color: var(--perigo); color: #fff; }
  button.sucesso { background: var(--sucesso); border-color: var(--sucesso); color: #fff; }
  button.link { background: none; border: none; color: var(--primaria); font: 600 14px inherit; padding: 4px; }

  .lista { list-style: none; margin: 0; padding: 0; }
  .lista li { display: flex; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px solid var(--borda); }
  .lista li:last-child { border-bottom: none; }
  .lista li .info { flex: 1; min-width: 0; }
  .lista li .qtd { font-weight: 700; font-size: 16px; white-space: nowrap; }
  .lista li.ok { background: var(--fundo-sucesso); }
  .lista li.erro .info { color: var(--perigo); }
  .lista li.clicavel:active { background: var(--fundo-info); }
  .x { border: none; background: none; color: var(--texto-2); font-size: 20px; width: 34px; height: 34px; flex: none; }
  .check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--borda); flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; }
  li.ok .check { background: var(--sucesso); border-color: var(--sucesso); }
  .contador { font-size: 26px; font-weight: 800; }
  .progresso { height: 7px; border-radius: 4px; background: var(--bg); overflow: hidden; margin-top: 4px; }
  .progresso > span { display: block; height: 100%; background: var(--primaria); }
  .progresso.completo > span { background: var(--sucesso); }
  .radar { height: 46px; border-radius: 23px; background: var(--bg); border: 1px solid var(--borda); overflow: hidden; margin: 14px 0 8px; }
  .radar-barra { height: 100%; width: 0; background: hsl(220, 85%, 50%); transition: width .15s, background .15s; }
  .lista li.escolhido { background: var(--fundo-info); box-shadow: inset 4px 0 0 var(--primaria); }
  .selo { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 11.5px; font-weight: 700; background: var(--bg); color: var(--texto-2); white-space: nowrap; }
  .selo.perigo { background: var(--fundo-perigo); color: var(--perigo); } .selo.alerta { background: var(--fundo-alerta); color: var(--alerta); }
  .selo.sucesso { background: var(--fundo-sucesso); color: var(--sucesso); } .selo.info { background: var(--fundo-info); color: var(--primaria); }
  .vazio { color: var(--texto-2); text-align: center; padding: 10px; font-size: 14px; }

  dialog { border: none; border-radius: 12px; padding: 16px; width: min(340px, calc(100vw - 24px)); background: var(--painel); color: var(--texto); box-shadow: 0 16px 40px #0007; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h3 { margin: 0 0 10px; font-size: 17px; }
  dialog .botoes { margin-top: 12px; }
  #rodape { flex: none; text-align: center; font-size: 12.5px; color: var(--texto-2); padding: 5px 8px; border-top: 1px solid var(--borda); }
  #msg { flex: none; padding: 10px 12px; font-size: 15px; font-weight: 600; white-space: pre-line; display: none; border-top: 3px solid; max-height: 35vh; overflow-y: auto; }
  #msg.ok { display: block; background: var(--fundo-sucesso); border-color: var(--sucesso); color: var(--texto); }
  #msg.erro { display: block; background: var(--fundo-perigo); border-color: var(--perigo); color: var(--texto); }
  #msg.alerta { display: block; background: var(--fundo-alerta); border-color: var(--alerta); color: var(--texto); }
  #msg.info { display: block; background: var(--fundo-info); border-color: var(--primaria); color: var(--texto); }
</style>
</head>
<body>
<div class="status" id="status">
  <span id="hora">--:--</span>
  <span class="dir">
    <span id="iconeWifi" title="Conexão com o servidor">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path class="arco a3" d="M1 5a11.5 11.5 0 0 1 16 0"/><path class="arco a2" d="M3.5 7.8a8 8 0 0 1 11 0"/>
        <path class="arco a1" d="M6.2 10.4a4 4 0 0 1 5.6 0"/><circle class="arco a0" cx="9" cy="12.6" r="1" fill="currentColor" stroke="none"/>
        <path class="corte" d="M2 1l14 12" stroke="#ef5350" style="display:none"/>
      </svg>
    </span>
    <span id="bateria" hidden title="Bateria">
      <span id="bateriaPct"></span>
      <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.75" y="0.75" width="19.5" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect x="21" y="3.5" width="2.2" height="5" rx="1" fill="currentColor"/>
        <rect id="bateriaNivel" x="2.5" y="2.5" width="16" height="7" rx="1" fill="currentColor"/>
        <path id="bateriaRaio" d="M11.5 1.5L7.5 6.5h3l-1.5 4 4.5-5.5h-3z" fill="#000" stroke="#000" stroke-width=".6" style="display:none"/></svg>
    </span>
  </span>
</div>
<header>
  <button id="voltar" aria-label="Voltar" style="display:none">←</button>
  <h1 id="titulo">WMS Coletor</h1>
  <button id="btTelaCheia" aria-label="Tela cheia" title="Tela cheia" hidden>⛶</button>
  <button id="modo" class="rfid" title="O gatilho lê: RFID ou código de barras (toque para trocar)" hidden>📡</button>
  <button id="teclado" title="Abrir o teclado">⌨</button>
  <button id="btConfig" title="Config">⚙</button>
</header>
<!-- Campo invisível que recebe o que o DataWedge "digita" (código de barras). Não remover. -->
<textarea id="leitura" class="captura" rows="1" inputmode="none" autocomplete="off" autocapitalize="characters"
          spellcheck="false" tabindex="-1" aria-hidden="true"></textarea>
<main id="tela"></main>
<div id="msg" role="status"></div>
<footer id="rodape"></footer>
<div id="tecladoTela" hidden></div>

<!-- ⌨ numa tela sem campo de digitação: digitar um código ou EPC à mão -->
<dialog id="dlgDigitar"><form method="dialog" id="formDigitar">
  <h3>Digitar código</h3>
  <input id="edDigitar" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" placeholder="Código de barras, SKU ou EPC">
  <div class="botoes"><button class="b" type="button" id="digCancelar">Cancelar</button><button class="b primario" type="submit">OK</button></div>
</form></dialog>

<!-- Config protegida por senha -->
<dialog id="dlgSenha" class="pin">
  <h3>PIN do administrador</h3>
  <div class="pin-visor" id="pinVisor">—</div>
  <div class="pin-teclado" id="pinTeclado">
    <button type="button">1</button><button type="button">2</button><button type="button">3</button>
    <button type="button">4</button><button type="button">5</button><button type="button">6</button>
    <button type="button">7</button><button type="button">8</button><button type="button">9</button>
    <button type="button" data-t="apagar">⌫</button><button type="button">0</button><button type="button" data-t="ok" class="ok">OK</button>
  </div>
  <div class="pin-rodape"><button type="button" id="senhaCancelar">CANCELAR</button></div>
</dialog>

<!-- Botão ⚙: configuração do servidor -->
<dialog id="dlgServidor"><form method="dialog" id="formServidor">
  <h3>Endereço do servidor (PC)</h3>
  <input id="edServidor" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="http://192.168.0.10:8000">
  <p class="fraco" id="dlgInfo"></p>
  <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="edTelaCheia" style="width:auto"> Tela cheia (esconder a barra do Chrome)</label>
  <p class="fraco" id="dlgInstalar" style="margin-top:8px"></p>
  <div class="botoes"><button class="b" type="button" id="dlgCancelar">Cancelar</button><button class="b primario" type="submit">Salvar</button></div>
</form></dialog>

<script>
"use strict";
// ======================================================================= utilidades
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => Number(v ?? 0).toLocaleString("pt-BR", { maximumFractionDigits: 3 });
// Lote não aparece nas telas: cada item fica num local (Local-01 é o padrão)
const loteTxt = () => "";
const lotePonto = () => "";
const dataBR = (d) => (d ? d.slice(0, 10).split("-").reverse().join("/") : "-");
const numero = (texto) => { const v = parseFloat(String(texto).replace(",", ".")); return Number.isFinite(v) ? v : NaN; };

async function api(metodo, url, corpo) {
  let r;
  try {
    r = await fetch(url, { method: metodo, headers: { "Content-Type": "application/json" }, body: corpo ? JSON.stringify(corpo) : undefined });
  } catch {
    sinalWifi(null);
    throw new Error("Sem conexão com o servidor. Confira o Wi-Fi.");
  }
  if (!conectado) sinalWifi(1);
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof dados.detail === "string" ? dados.detail : "Erro no servidor");
  return dados;
}

// ---- retorno para o operador: mensagem, bipe e vibração
// Configurações do coletor (tela Config), guardadas no próprio aparelho
// Potência da antena (%) por tipo de tela: Recebimento (ordem e entrada), Baixa e Localizar
const cfg = { volume: 100, potRecebimento: 100, potBaixa: 100, potLocalizar: 100, potLer: 100, potGravar: 30, localBaixa: null };
try { Object.assign(cfg, JSON.parse(localStorage.getItem("coletor.cfg") || "{}")); } catch {}
const POTENCIA_DA_TELA = { entrada: "potRecebimento", avulsa: "potRecebimento", baixa: "potBaixa", localizar: "potLocalizar", ler: "potLer", remoto: "potLer" };
const potenciaDaTela = (nome) => cfg[POTENCIA_DA_TELA[nome]] || 100;   // outras telas (inventário): 100%
function salvarCfg() { try { localStorage.setItem("coletor.cfg", JSON.stringify(cfg)); } catch {} }
// No app, o volume é o volume de mídia do próprio coletor; no navegador, o volume do bipe.
const ganhoBipe = () => (window.ColetorApp?.volume ? 1 : cfg.volume / 100);

let audio;
function bipe(tipo) {
  try {
    audio = audio || new AudioContext();
    const tons = tipo === "erro" ? [[330, 0], [260, 0.16]] : tipo === "alerta" ? [[880, 0], [880, 0.14]] : [[1800, 0]];
    tons.forEach(([f, atraso]) => {
      const o = audio.createOscillator(), v = audio.createGain();
      o.type = "square"; o.frequency.value = f; v.gain.value = ganhoBipe();
      o.connect(v).connect(audio.destination);
      o.start(audio.currentTime + atraso); o.stop(audio.currentTime + atraso + 0.12);
    });
  } catch {}
  if (tipo === "erro" && navigator.vibrate) navigator.vibrate([120, 60, 120]);
}
let timerMsg;
function msg(texto, tipo = "ok", som = true) {
  // O coletor nunca trava o operador: só a falta de conexão aparece como erro.
  if ((tipo === "erro" || tipo === "alerta") && !/conex|Wi-Fi/i.test(texto || "")) { tipo = "info"; som = false; }
  const m = $("msg");
  m.className = texto ? tipo : "";
  m.textContent = texto || "";
  if (texto && som) bipe(tipo);
  clearTimeout(timerMsg);
  if (texto) timerMsg = setTimeout(() => (m.className = ""), 3000);   // toda notificação some em 3 s
}
/** Roda uma ação no servidor: trava o botão e mostra o erro com bipe. */
async function executar(botao, acao) {
  if (botao) botao.disabled = true;
  try { return await acao(); }
  catch (e) { msg(e.message, "erro"); }
  finally { if (botao) botao.disabled = false; }
}

// ======================================================================= app do coletor (Android)
// No app "Coletor WMS" o WebView cria window.ColetorApp. No simulador (/coletor) a página
// roda num iframe e o simulador oferece um ColetorAppSimulado. No Chrome: null.
const app = (() => {

})();
// Modo local: a tela veio de dentro do APK (sem servidor). Só Ler etiqueta, Gravar e Config funcionam.
const LOCAL = location.protocol === "file:";
const TELAS_LOCAIS = ["menu", "ler", "gravar", "config"];
let modoGatilho = "rfid", potenciaAtual = 100;
/** O gatilho do MC33xxR é um só: lê RFID ou código de barras (a chave ao lado do campo Leitura). */
function definirGatilho(modo) {
  if (!app) return;
  modoGatilho = modo;

}
if (app) {

  $("modo").addEventListener("click", (ev) => {

}
/** O app avisa quando o gatilho é apertado/solto em modo RFID (mostra "Lendo…" na chave). */
window.gatilhoRfidEvento = (apertado) => {

/** Fim de cada leitura RFID: quantas etiquetas o leitor viu. */
// Só avisa quando algo deu errado (no uso normal, a própria etiqueta lida já aparece na tela).
let recebidasNaLeitura = 0;
window.fimLeituraRfid = (n) => {

  if (n === 0) msg("RFID: o leitor não viu nenhuma etiqueta.\nAproxime o coletor das etiquetas e segure o gatilho por 1–2 s.", "alerta");
  else if (recebidasNaLeitura === 0) msg(`RFID: o leitor viu ${n} etiqueta(s), mas elas não chegaram à tela.`, "erro");
};
/** O app chama a cada etiqueta lida pelo RFID. */
window.leituraRfid = (epc) => {

// ======================================================================= captura das leituras (DataWedge)
const leitura = $("leitura");
const ehEpc = (v) => /^[0-9A-F]{16,}$/i.test(v) && !/^\d{8,14}$/.test(v);
const ehEditavel = (el) => el && el.matches && el.matches("input:not([type=checkbox]):not([type=radio]):not([type=date]), textarea") && el !== leitura;

function processarLeitura(bruto) {
  const dado = String(bruto).trim().toUpperCase();
  if (!dado) return;
  leitura.placeholder = "Última: " + dado;
  const t = telas[telaAtual];
  if (ehEpc(dado)) {
    if (t.rfid) t.rfid(dado); else msg("Esta tela não usa RFID", "alerta");
  } else if (enderecos.some((e) => e.codigo === dado) && t.endereco) {
    t.endereco(enderecos.find((e) => e.codigo === dado));
  } else if (t.codigo) {
    t.codigo(dado);
  } else {
    msg("Leitura não usada nesta tela: " + dado, "alerta");
  }
}

// Toda leitura termina sozinha, com ou sem o ENTER do DataWedge: o que chega de uma vez
// (ou rápido demais para ser gente digitando) é leitura; ~0,1 s depois de parar de chegar,
// é processada. Digitação do operador (teclado físico ou virtual) continua esperando o ENTER.
const PAUSA_FIM_LEITURA = 100;   // ms sem chegar nada = fim da leitura
const DIGITACAO_RAPIDA = 50;     // ms entre teclas: abaixo disso é o leitor, não uma pessoa

// 1) Campo "Leitura": cada linha (dado + ENTER) é uma leitura; sem ENTER, termina pela pausa.
let rajadaLeitura = { n: 0, bloco: false, ultimo: 0 }, timerLeitura;
function finalizarLeitura() {
  clearTimeout(timerLeitura);
  const v = leitura.value; leitura.value = "";
  rajadaLeitura = { n: 0, bloco: false, ultimo: 0 };
  v.split(/\r?\n/).forEach(processarLeitura);
}
leitura.addEventListener("input", (ev) => {
  if (leitura.value.includes("\n")) {
    const partes = leitura.value.split(/\r?\n/);
    leitura.value = partes.pop();
    partes.forEach(processarLeitura);
    if (!leitura.value) return;
  }
  const agora = performance.now();
  if (agora - rajadaLeitura.ultimo > DIGITACAO_RAPIDA) rajadaLeitura = { n: 0, bloco: false, ultimo: 0 };
  rajadaLeitura.n++;
  rajadaLeitura.bloco ||= (ev.data || "").length >= 4;   // DataWedge mandou o código inteiro de uma vez
  rajadaLeitura.ultimo = agora;
  clearTimeout(timerLeitura);
  timerLeitura = setTimeout(() => {
    if ((rajadaLeitura.bloco || rajadaLeitura.n >= 4) && leitura.value.trim()) finalizarLeitura();
  }, PAUSA_FIM_LEITURA);
});
leitura.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter") return;
  ev.preventDefault();
  if (leitura.inputMode !== "none") tecladoManual(false);   // leitura digitada: fecha o teclado
  finalizarLeitura();
});

// 2) Leitura que caiu em outro campo (ex.: Lote): tira de lá e processa como leitura.
function leituraNoCampo(el, dado, base) {
  clearTimeout(el._timerLeitura);
  el.value = base;
  el.dataset.antes = base;
  delete el.dataset.pendente;
  rajada = { el: null, n: 0, ultimo: 0, base: "" };
  if (dado) processarLeitura(dado);
}
// ...chegou de uma vez só (DataWedge mandou o texto inteiro)...
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (!ehEditavel(el)) return;
  const antes = el.dataset.antes ?? "";
  if (ev.inputType !== "insertFromPaste" && el.value.length - antes.length >= 6 && el.value.startsWith(antes)) {
    const dado = el.value.slice(antes.length);
    el.dataset.pendente = dado;
    clearTimeout(el._timerLeitura);
    el._timerLeitura = setTimeout(() => { if (el.dataset.pendente === dado) leituraNoCampo(el, dado, antes); }, PAUSA_FIM_LEITURA);
    return;
  }
  el.dataset.antes = el.value;
}, true);
// ...ou tecla por tecla, rápido demais para ser gente digitando.
let rajada = { el: null, n: 0, ultimo: 0, base: "" };
document.addEventListener("keydown", (ev) => {
  const el = ev.target;
  if (!ehEditavel(el)) return;
  const t = performance.now();
  if (ev.key.length === 1) {
    if (rajada.el !== el || t - rajada.ultimo > DIGITACAO_RAPIDA) rajada = { el, n: 0, base: el.value };
    rajada.n++; rajada.ultimo = t;
    clearTimeout(el._timerLeitura);
    el._timerLeitura = setTimeout(() => {
      if (rajada.el === el && rajada.n >= 6) leituraNoCampo(el, el.value.slice(rajada.base.length), rajada.base);
    }, PAUSA_FIM_LEITURA);
    return;
  }
  if (ev.key !== "Enter") return;
  ev.preventDefault();
  if (el.dataset.pendente) return leituraNoCampo(el, el.dataset.pendente, el.dataset.antes ?? "");
  if (rajada.el === el && rajada.n >= 6 && t - rajada.ultimo < 120) return leituraNoCampo(el, el.value.slice(rajada.base.length), rajada.base);
  rajada = { el: null, n: 0, ultimo: 0, base: "" };
  el.dataset.antes = el.value;
  if (el.dataset.enter) telas[telaAtual][el.dataset.enter]?.();   // ENTER digitado pelo operador
}, true);

// 3) Mantém o foco no campo Leitura (sem abrir o teclado virtual) quando não há outro campo em uso.
const teclado = navigator.virtualKeyboard;   // Chrome 94+: controle do teclado virtual (se não existir, o Android decide sozinho)
function focarLeitura() {
  if (document.querySelector("dialog[open]")) return;
  if (!ehEditavel(document.activeElement) && document.activeElement?.tagName !== "SELECT") {
    leitura.focus({ preventScroll: true });
    if (leitura.inputMode === "none") teclado?.hide();
  }
}
document.addEventListener("click", () => setTimeout(focarLeitura, 0));
document.addEventListener("focusout", () => setTimeout(focarLeitura, 50));
document.addEventListener("change", (ev) => { if (ev.target.tagName === "SELECT") setTimeout(() => leitura.focus({ preventScroll: true }), 50); });

// 4) Teclado virtual só quando precisa digitar: campos de digitação (lote, quantidade...) e o botão ⌨.
document.addEventListener("focusin", (ev) => {
  const el = ev.target;
  if (!ehEditavel(el) && !(el === leitura && leitura.inputMode !== "none")) return;
  el.setAttribute("virtualkeyboardpolicy", "manual");
  teclado?.show();
  setTimeout(() => el.scrollIntoView({ block: "center", behavior: "smooth" }), 250);   // não deixa o campo atrás do teclado
});
/** Leva o operador para um campo de digitação e abre o teclado (numérico em quantidade). */
function digitar(el) {
  if (!el) return;
  el.focus();
  teclado?.show();
}
function tecladoManual(ligar) {
  leitura.inputMode = ligar ? "text" : "none";
  $("teclado").style.background = ligar ? "var(--fundo-info)" : "";
  leitura.placeholder = ligar ? "Digite o código e toque em Enter" : "Leitura: aperte o gatilho";
  leitura.blur(); leitura.focus();
  if (ligar) teclado?.show(); else teclado?.hide();
}
// Teclado na tela: digita no campo com foco. Numérico nos campos de quantidade.
const kb = { el: $("tecladoTela"), alvo: null };
const LINHAS_ALFA = ["1234567890", "QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM-."];
function abrirTecladoTela(alvo) {
  if (!alvo) return;
  kb.alvo = alvo;
  const numerico = ["decimal", "numeric"].includes(alvo.inputMode) || alvo.type === "number";
  const tecla = (t, classe = "", rotulo = t) => `<button type="button" data-tecla="${t}" class="${classe}">${rotulo}</button>`;
  kb.el.className = numerico ? "numerico" : "";
  kb.el.innerHTML = numerico
    ? ["123", "456", "789"].map((l) => `<div class="linha">${[...l].map((c) => tecla(c)).join("")}</div>`).join("") +
      `<div class="linha">${tecla(",")}${tecla("0")}${tecla("BS", "esp", "⌫")}</div>
       <div class="linha">${tecla("FECHAR", "esp", "✕ Fechar")}${tecla("OK", "ok", "OK ↵")}</div>`
    : LINHAS_ALFA.map((l, i) => `<div class="linha">${[...l].map((c) => tecla(c)).join("")}${i === 2 ? tecla("BS", "esp", "⌫") : ""}</div>`).join("") +
      `<div class="linha">${tecla("FECHAR", "esp", "✕")}${tecla("ESPACO", "esp", "espaço").replace("<button", '<button style="flex:4"')}${tecla("OK", "ok", "OK ↵").replace("<button", '<button style="flex:2"')}</div>`;
  const dlg = alvo.closest("dialog");
  (dlg || document.body).appendChild(kb.el);   // dentro do diálogo aberto (senão fica atrás dele)
  kb.el.hidden = false;
  document.body.classList.add("com-teclado");
  setTimeout(() => alvo.scrollIntoView({ block: "center" }), 50);
  if (!cfg.teclado) { cfg.teclado = true; salvarCfg(); marcarTecla(); }
}
function fecharTecladoTela() {
  kb.el.hidden = true; kb.alvo = null;
  document.body.classList.remove("com-teclado");
  document.body.appendChild(kb.el);
}
kb.el.addEventListener("pointerdown", (ev) => ev.preventDefault());   // não tira o foco do campo
kb.el.addEventListener("click", (ev) => {
  ev.stopPropagation();
  const b = ev.target.closest("[data-tecla]");
  const el = kb.alvo;
  if (!b || !el) return;
  const t = b.dataset.tecla;
  el.focus({ preventScroll: true });
  if (t === "FECHAR") return fecharTecladoTela();
  if (t === "OK") {
    fecharTecladoTela();
    if (el.dataset.enter) telas[telaAtual][el.dataset.enter]?.();
    else if (el.form) el.form.requestSubmit();
    else el.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    return;
  }
  const ini = el.selectionStart ?? el.value.length, fim = el.selectionEnd ?? el.value.length;
  if (t === "BS") {
    if (ini === fim && ini > 0) el.setRangeText("", ini - 1, fim, "end"); else el.setRangeText("", ini, fim, "end");
  } else {
    el.setRangeText(t === "ESPACO" ? " " : t, ini, fim, "end");
  }
  el.dispatchEvent(new Event("input", { bubbles: true }));
  navigator.vibrate?.(10);
});
document.addEventListener("focusin", (ev) => {
  if (!kb.el.hidden && ehEditavel(ev.target) && ev.target !== kb.alvo) abrirTecladoTela(ev.target);   // trocou de campo
});
// Teclado ligado (⌨): tocar num campo abre o teclado (no fim do toque, para a tela não pular sob o dedo);
// tocar fora fecha.
document.addEventListener("click", (ev) => {
  if (ev.target.closest("#tecladoTela, #teclado")) return;
  if (cfg.teclado && ehEditavel(ev.target) && ev.target !== leitura) abrirTecladoTela(ev.target);
  else if (!kb.el.hidden) fecharTecladoTela();
}, true);
window.addEventListener("hashchange", () => { if (!kb.el.hidden) fecharTecladoTela(); });

/** ⌨ do cabeçalho: liga/desliga o teclado. Ligado: abre no campo da tela (sem campo, "Digitar código")
 *  e volta a abrir sempre que tocar num campo. Desligado: nenhum teclado aparece. */
function marcarTecla() { $("teclado").classList.toggle("ligado", !!cfg.teclado); }
$("teclado").addEventListener("click", (ev) => {
  ev.stopPropagation();
  cfg.teclado = !cfg.teclado; salvarCfg(); marcarTecla();
  if (!cfg.teclado) { fecharTecladoTela(); msg("Teclado desligado", "info"); return; }
  msg("Teclado ligado: toque num campo para digitar", "info");
  const campo = [...tela.querySelectorAll("input, textarea")].find((el) =>
    !["range", "checkbox", "radio", "date", "hidden"].includes(el.type) && el.offsetParent !== null);
  if (campo) {
    campo.focus();
    abrirTecladoTela(campo);
  } else {
    $("edDigitar").value = "";
    $("dlgDigitar").showModal();
    $("edDigitar").focus();
    abrirTecladoTela($("edDigitar"));
  }
});
marcarTecla();
$("digCancelar").addEventListener("click", () => $("dlgDigitar").close());
$("formDigitar").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const v = $("edDigitar").value;
  $("dlgDigitar").close();
  if (v.trim()) processarLeitura(v);
});
$("dlgDigitar").addEventListener("close", () => { if (kb.alvo === $("edDigitar")) fecharTecladoTela(); setTimeout(focarLeitura, 50); });

// 5) Tela cheia: esconde a barra de endereços do Chrome. O navegador só deixa entrar
//    em tela cheia depois de um toque, e o Chrome do Android sai dela sozinho em alguns
//    casos (voltar, teclado virtual, seletor de data/lista). Por isso a página pede de novo
//    a cada toque ou tecla. Instalada como app (ícone na tela inicial), não há barra nenhuma.
const instaladoComoApp = () => matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches && !document.fullscreenElement;
let querTelaCheia = true;
try { querTelaCheia = localStorage.getItem("coletor.telaCheia") !== "0"; } catch {}
if (app) querTelaCheia = false;   // o app já abre sem barra do Chrome
function entrarTelaCheia() {
  if (!querTelaCheia || document.fullscreenElement || instaladoComoApp() || !document.documentElement.requestFullscreen) return;
  document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
}
["click", "touchend", "pointerup"].forEach((tipo) => document.addEventListener(tipo, entrarTelaCheia, true));
document.addEventListener("keydown", (ev) => { if (ev.key !== "Escape") entrarTelaCheia(); }, true);
$("btTelaCheia").addEventListener("click", (ev) => { ev.stopPropagation(); querTelaCheia = true; entrarTelaCheia(); });

// ======================================================================= barra de status (hora, Wi-Fi, bateria)
// O navegador não informa a potência do Wi-Fi: as barras mostram a qualidade da
// conexão com o SERVIDOR (tempo de resposta), que é o que importa para o coletor.
let conectado = true;
function sinalWifi(ms) {
  conectado = ms !== null;
  const barras = ms === null ? 0 : ms < 150 ? 4 : ms < 400 ? 3 : ms < 1000 ? 2 : 1;
  const icone = $("iconeWifi");
  icone.querySelectorAll(".arco").forEach((a) => (a.style.opacity = Number(a.classList[1].slice(1)) < barras ? 1 : 0.25));
  icone.querySelector(".corte").style.display = conectado ? "none" : "";
  icone.className = !conectado ? "off" : barras <= 2 ? "baixo" : "";
  icone.title = conectado ? `Servidor respondeu em ${ms} ms` : "Sem conexão com o servidor";
}
// Hora do SERVIDOR (o relógio do coletor pode estar errado), andando com o relógio local
let diferencaRelogio = 0;
async function medirServidor() {
  if (LOCAL) return mostrarHora();
  const inicio = performance.now();
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    const s = await r.json();
    const ms = Math.round(performance.now() - inicio);
    diferencaRelogio = new Date(s.data_hora.replace(" ", "T")).getTime() + ms / 2 - Date.now();
    sinalWifi(ms);
  } catch { sinalWifi(null); }
  mostrarHora();
}
function mostrarHora() {
  const d = new Date(Date.now() + diferencaRelogio);
  $("hora").textContent = d.toTimeString().slice(0, 5);
}
setInterval(mostrarHora, 5000);
setInterval(medirServidor, 10000);
window.addEventListener("online", medirServidor);
window.addEventListener("offline", () => sinalWifi(null));
medirServidor();

// Bateria (Chrome: só em origem segura; sem permissão o ícone fica escondido)
navigator.getBattery?.().then((b) => {
  const mostrar = () => {
    const pct = Math.round(b.level * 100);
    $("bateria").hidden = false;
    $("bateriaPct").textContent = pct + "%";
    $("bateriaNivel").setAttribute("width", Math.max(1, 16 * b.level));
    $("bateriaNivel").style.fill = pct <= 15 && !b.charging ? "#ef5350" : "currentColor";
    $("bateriaRaio").style.display = b.charging ? "" : "none";
  };
  mostrar();
  b.addEventListener("levelchange", mostrar);
  b.addEventListener("chargingchange", mostrar);
}).catch(() => {});

// A barra só aparece em tela cheia (fora dela o Android já mostra a dele)
function atualizarTelaCheia() {
  const cheia = !!document.fullscreenElement || matchMedia("(display-mode: fullscreen)").matches;
  document.documentElement.classList.toggle("tela-cheia", cheia);

// ======================================================================= dados de apoio
let produtos = [], enderecos = [], motivos = [];
async function carregarApoio() {

    api("GET", "/api/status").then((s) => s.motivos)]);

}
const buscarProduto = (codigo) => api("GET", "/api/produtos/busca?codigo=" + encodeURIComponent(codigo));

  `<option value="${e.id}" ${e.id === selecionado ? "selected" : ""}>${esc(e.codigo)}${e.tipo !== "ARMAZENAGEM" ? " (" + e.tipo.toLowerCase() + ")" : ""}</option>`).join("");
const seloValidade = (v) => {
  if (!v) return "";
  const dias = Math.round((new Date(v) - new Date(new Date().toISOString().slice(0, 10))) / 86400000);
  return dias < 0 ? `<span class="selo perigo">vencido</span>` : dias <= 30 ? `<span class="selo alerta">vence em ${dias}d</span>` : "";
};
function cartaoProduto(p, trocar = true) {
  return p ? `<div class="card"><h2>Produto ${trocar ? `<span class="dir"><button class="link" data-acao="trocarProduto">trocar</button></span>` : ""}</h2>
      <div class="produto">${esc(p.sku)}</div><div>${esc(p.descricao)} <span class="fraco">· ${esc(p.unidade)}</span></div></div>`
    : `<div class="dica">Bipe o <b>código de barras</b> do produto</div>`;
}

const tela = $("tela");

function abrir(nome) {
  if (!telas[nome]) nome = "menu";
  if (LOCAL && !TELAS_LOCAIS.includes(nome)) nome = "menu";
  if (nome !== "config") configLiberada = false;
  if (telaAtual === "ler" && nome !== "ler") { try { app?.detalharEtiquetas?.(false); } catch {} }
  if (telaAtual === "remoto" && nome !== "remoto") telas.remoto.sair();
  if (telaAtual === "localizar" && nome !== "localizar") telas.localizar.sair();

  $("voltar").style.display = nome === "menu" ? "none" : "";   // seta depois do logo (o logo não sai do lugar)
  msg("");

  definirPotencia(potenciaDaTela(nome));   // potência escolhida em Config para esta tela (padrão 100%)
  telas[nome].abrir();
  focarLeitura();
}

// ======================================================================= ENTRADA AVULSA (sem ordem)
telas.avulsa = {
  titulo: "Entrada",
  abrir() {
    this.produto = null; this.tags = new Map();
    this.emEstoque = new Set();    // etiquetas já em estoque: ignoradas em silêncio (não aparecem, não bipam)
    this.conferindo = new Set();   // consultando no servidor (não consulta a mesma duas vezes)
    this.desenhar();
  },
  desenhar() {
    const p = this.produto;
    definirGatilho(p ? "rfid" : "barras");   // escolhe o produto (lista ou código de barras), depois lê as etiquetas
    const ativos = produtos.filter((x) => x.ativo);
    tela.innerHTML = p ? cartaoProduto(p) + `
      <div class="card">
        <label class="campo"><span>Quantidade (produto sem etiqueta)</span><input id="enQtd" inputmode="decimal" enterkeyhint="done" data-enter="registrar" placeholder="ou leia as etiquetas RFID"></label>
      </div>
      <div class="card"><h2>Etiquetas RFID <span class="dir"><span class="contador" id="enCont">0</span></span></h2>
        <ul class="lista" id="enTags"></ul></div>
      <div class="botoes"><button class="b" data-acao="limpar">Limpar</button><button class="b primario" data-acao="registrar" id="enBotao">Registrar entrada</button></div>`
      : `<div class="card"><h2>Produto</h2>
          <select id="enProduto"><option value="">— escolha o produto —</option>
            ${ativos.map((x) => `<option value="${esc(x.sku)}">${esc(x.sku)} · ${esc(x.descricao)}</option>`).join("")}</select>
          <p class="fraco" style="margin:8px 0 0">Ou bipe o código de barras do produto. Depois aperte o gatilho perto das etiquetas.</p></div>`;
    if (p) this.desenharTags();
    else $("enProduto").addEventListener("change", () => { if ($("enProduto").value) this.codigo($("enProduto").value); });
  },
  desenharTags() {
    const novas = [...this.tags.values()].filter((t) => t.ok).length;
    $("enCont").textContent = novas;
    $("enTags").innerHTML = [...this.tags.values()].reverse().map((t) => `<li class="${t.ok ? "" : "erro"}">
        <div class="info"><div class="mono">${esc(t.epc)}</div><div class="fraco">${esc(t.info)}</div></div>
        <button class="x" data-acao="removerTag" data-valor="${esc(t.epc)}">✕</button></li>`).join("")
      || `<li class="vazio">Aperte o gatilho perto das etiquetas</li>`;
    $("enBotao").textContent = novas ? `Registrar ${novas} etiqueta(s)` : "Registrar entrada";
  },
  async codigo(c) {
    await executar(null, async () => {
      if (this.produto && this.tags.size) throw new Error("Envie ou limpe as etiquetas antes de trocar de produto");
      const p = await buscarProduto(c);
      if (!p.ativo) throw new Error(`Produto ${p.sku} está inativo`);
      this.produto = p; this.tags = new Map();
      this.desenhar(); msg(`${p.sku} · ${p.descricao}: aperte o gatilho perto das etiquetas`, "ok");
    });
  },
  async rfid(epc) {
    if (!this.produto) {
      const ativos = produtos.filter((x) => x.ativo);
      if (ativos.length !== 1) return msg("Escolha o produto na lista (ou bipe o código de barras)", "info");
      await this.codigo(ativos[0].sku);   // só existe um produto: já escolhe
    }
    // Já na lista, já sabida em estoque ou sendo conferida: a leitura repetida não faz nada
    if (this.tags.has(epc) || this.emEstoque.has(epc) || this.conferindo.has(epc)) return;
    this.conferindo.add(epc);
    let info = "nova";
    try {
      const tag = await api("GET", "/api/tags/" + encodeURIComponent(epc));
      if (tag.status === "ATIVA") { this.emEstoque.add(epc); return; }   // já em estoque: ignorada em silêncio
      info = `reaproveitada (era ${tag.sku})`;
    } catch (e) {
      if (/conex|Wi-Fi/i.test(e.message)) { msg(e.message, "erro"); return; }   // sem rede: pode ler de novo
      /* etiqueta nunca cadastrada: nova */
    } finally {
      this.conferindo.delete(epc);
    }
    if (this.tags.has(epc) || !this.produto) return;
    this.tags.set(epc, { epc, ok: true, info });   // só a etiqueta nova aparece e bipa
    bipe("ok");
    if (telaAtual === "avulsa") this.desenharTags();
  },
  removerTag(_b, epc) { this.tags.delete(epc); this.desenharTags(); },
  trocarProduto() { if (this.tags.size) return msg("Envie ou limpe as etiquetas antes", "alerta"); this.abrir(); },
  limpar() { this.abrir(); msg(""); },
  async registrar() {
    const b = $("enBotao");
    const epcs = [...this.tags.values()].filter((t) => t.ok).map((t) => t.epc);
    const qtd = numero($("enQtd").value);
    if (!epcs.length && !(qtd > 0)) return msg("Leia as etiquetas RFID ou informe a quantidade", "alerta");
    await executar(b, async () => {
      const r = await api("POST", "/api/entradas", {
        produto_id: this.produto.id, quantidade: epcs.length ? 0 : qtd, epcs,
        origem: "COLETOR", meio: epcs.length ? "RFID" : "BARRAS",
      });
      this.abrir();
      msg(`OK: entrada de ${num(r.quantidade)} ${r.sku}\n saldo ${num(r.saldo)}` +
        (r.avisos.length ? "\n⚠ " + r.avisos.join("\n⚠ ") : ""), r.avisos.length ? "alerta" : "ok");
    });
  },
};

// ======================================================================= RECEBIMENTO (ordens criadas no PC)
// O PC cadastra a ordem (NF, itens, lotes, quantidades). Aqui o operador escolhe o
// item e lê as etiquetas: cada leitura vai NA HORA para o servidor (a tela do PC
// mostra ao vivo). Finalizar dá entrada no estoque.
const barraProgresso = (lidas, prevista) =>
  `<div class="progresso ${lidas >= prevista ? "completo" : ""}"><span style="width:${Math.min(100, prevista ? (100 * lidas) / prevista : 0)}%"></span></div>`;
telas.entrada = {
  titulo: "Recebimento",
  gatilho: "barras",
  async abrir() {
    this.ordem = null; this.itemId = null; this.buffer = []; this.confirmando = false;
    tela.innerHTML = `<div class="card"><h2>Ordens de recebimento abertas</h2><ul class="lista" id="orLista"><li class="vazio">Carregando…</li></ul></div>`;
    try {
      const lista = (await api("GET", "/api/recebimentos")).filter((r) => r.status === "ABERTO");
      if (telaAtual !== "entrada" || !$("orLista")) return;
      $("orLista").innerHTML = lista.map((r) => `<li class="clicavel" data-acao="abrirOrdem" data-valor="${r.id}">
          <div class="info"><b>${esc(r.numero)}</b>${r.documento ? " · " + esc(r.documento) : ""}
            <div class="fraco">${esc(r.fornecedor || "")} ${r.itens} item(ns)</div>${barraProgresso(r.lidas, r.prevista)}</div>
          <span class="qtd">${num(r.lidas)}/${num(r.prevista)}</span></li>`).join("")
        || `<li class="vazio">Nenhuma ordem aberta.<br>Crie no PC em "Ordens de recebimento".</li>`;
    } catch (e) { msg(e.message, "erro"); }
  },
  async abrirOrdem(_b, id) {
    if (this.ordem?.recebimento.id !== Number(id)) this.enviadas = new Set();   // outra ordem: começa do zero
    await executar(null, async () => {
      const d = await api("GET", "/api/recebimentos/" + id);
      this.ordem = d; this.confirmando = false;
      if (!d.itens.some((i) => i.id === this.itemId)) {
        const faltando = d.itens.filter((i) => i.lidas < i.prevista);
        this.itemId = faltando.length === 1 ? faltando[0].id : null;
      }
      this.desenhar();
    });
  },
  item() { return this.ordem?.itens.find((i) => i.id === this.itemId); },
  desenhar() {
    const d = this.ordem, r = d.recebimento, item = this.item();
    const total = d.itens.reduce((s, i) => s + i.prevista, 0), lidas = d.itens.reduce((s, i) => s + i.lidas, 0);
    definirGatilho(item ? "rfid" : "barras");   // sem item: bipa o produto; com item: lê as etiquetas
    tela.innerHTML = `<div class="card"><h2>${esc(r.numero)}${r.documento ? " · " + esc(r.documento) : ""}
        <span class="dir"><span class="contador">${num(lidas)}/${num(total)}</span></span></h2>
        ${r.fornecedor ? `<div class="fraco">${esc(r.fornecedor)}</div>` : ""}${barraProgresso(lidas, total)}</div>
      <div class="card"><h2>Itens <span class="dir fraco">toque ou bipe o produto</span></h2><ul class="lista">
        ${d.itens.map((i) => `<li class="clicavel ${i.id === this.itemId ? "escolhido" : ""}" data-acao="escolherItem" data-valor="${i.id}">
          <div class="info"><b>${esc(i.sku)}</b> ${seloValidade(i.validade)}
            <div class="fraco">${esc(i.descricao)}${i.validade ? " · val. " + dataBR(i.validade) : ""}</div>${barraProgresso(i.lidas, i.prevista)}</div>
          <span class="qtd">${num(i.lidas)}/${num(i.prevista)}</span></li>`).join("")}</ul></div>
      ${item ? `<div class="card"><h2>Item escolhido</h2>
          <div class="produto">${esc(item.sku)}</div>
          <p class="fraco" style="margin:4px 0 8px">Aperte o gatilho perto das etiquetas: cada uma já vai para o servidor.</p>
          <label class="campo"><span>Sem etiqueta RFID? Quantidade</span><input id="rcQtd" inputmode="decimal" enterkeyhint="done" data-enter="adicionarQtd"></label>
          <div class="botoes"><button class="b" data-acao="adicionarQtd" id="rcQtdBotao">Adicionar quantidade</button></div></div>`
        : `<div class="dica">Bipe o <b>código de barras</b> do produto<br>ou toque no item para escolher</div>`}
      ${this.confirmando ? this.htmlConfirmar() : `<div class="botoes" style="margin-top:8px"><button class="b" data-acao="abrir">Ordens</button>
        <button class="b sucesso" data-acao="pedirFinalizar" ${lidas ? "" : "disabled"}>Finalizar</button></div>`}`;
  },
  htmlConfirmar() {
    const faltas = this.ordem.itens.filter((i) => i.lidas !== i.prevista);
    return `<div class="card" style="border-color:var(--alerta)"><h2>Finalizar ${esc(this.ordem.recebimento.numero)}?</h2>
      <p style="margin:0 0 8px">Dá entrada no estoque de tudo que foi lido.</p>
      ${faltas.length ? `<p style="margin:0 0 8px;color:var(--alerta)"><b>Divergências:</b><br>${faltas.map((i) => `${esc(i.sku)}${loteTxt(i.lote)}: ${num(i.lidas)} de ${num(i.prevista)}`).join("<br>")}</p>` : ""}
      <div class="botoes"><button class="b" data-acao="cancelarFinalizar">Voltar</button><button class="b sucesso" data-acao="finalizar" id="rcFinalizar">Confirmar</button></div></div>`;
  },
  escolherItem(_b, id) {
    this.enviadas = new Set();   // outro item: etiquetas recusadas por "item completo" podem valer para ele
    this.itemId = Number(id); this.confirmando = false; this.desenhar(); msg(`Item ${this.item().sku}${loteTxt(this.item().lote)}: leia as etiquetas`, "info", false); },
  codigo(c) {
    if (!this.ordem) return msg("Abra uma ordem de recebimento", "alerta");
    const doProduto = this.ordem.itens.filter((i) => i.ean === c || i.sku.toUpperCase() === c);
    if (!doProduto.length) return;           // produto fora da ordem: ignorado
    const item = doProduto.find((i) => i.lidas < i.prevista) || doProduto[0];
    this.escolherItem(null, item.id);
    bipe("ok");
  },
  rfid(epc) {
    if (!this.ordem) return msg("Abra uma ordem de recebimento", "alerta");
    if (!this.item()) {
      const falta = this.ordem.itens.find((i) => i.lidas < i.prevista);
      if (!falta) return;                     // tudo completo: leitura ignorada
      this.itemId = falta.id; this.desenhar();
    }
    // já mandada nesta ordem (aceita ou recusada, ex.: já em estoque): não manda de novo
    this.enviadas ||= new Set();
    if (this.enviadas.has(epc)) return;
    this.enviadas.add(epc);
    // junta as leituras de ~0,25 s e manda de uma vez (online, sem esperar o operador)
    this.buffer.push(epc);
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.enviarBuffer(), 250);
  },
  async enviarBuffer() {
    const epcs = [...new Set(this.buffer)]; this.buffer = [];
    if (!epcs.length || !this.ordem) return;
    const rec = this.ordem.recebimento.id, itemId = this.itemId;
    try {
      const r = await api("POST", `/api/recebimentos/${rec}/leituras`, { item_id: itemId, epcs, origem: "COLETOR", meio: "RFID" });
      // etiqueta já em estoque, de outra ordem ou a mais: ignorada, o operador segue lendo
      const novas = r.tags.filter((t) => t.ok && !t.repetida).length;
      if (!novas) return;   // só etiquetas já em estoque/já lidas: segue em silêncio
      msg(`✓ ${novas} etiqueta(s) · ${r.sku} ${num(r.lidas)}/${num(r.prevista)}`);
      if (telaAtual === "entrada" && this.ordem?.recebimento.id === rec) await this.abrirOrdem(null, rec);
    } catch (e) {
      epcs.forEach((x) => this.enviadas?.delete(x));   // falhou a rede: pode ler de novo
      msg(e.message, "erro");
    }
  },
  async adicionarQtd() {
    const q = numero($("rcQtd")?.value);
    if (!(q > 0)) return msg("Informe a quantidade", "alerta");
    await executar($("rcQtdBotao"), async () => {
      const r = await api("POST", `/api/recebimentos/${this.ordem.recebimento.id}/leituras`,
        { item_id: this.itemId, quantidade: q, origem: "COLETOR", meio: "BARRAS" });
      await this.abrirOrdem(null, this.ordem.recebimento.id);
      msg(`✓ ${num(q)} · ${r.sku} ${num(r.lidas)}/${num(r.prevista)}`);
    });
  },
  pedirFinalizar() { this.confirmando = true; this.desenhar(); },
  cancelarFinalizar() { this.confirmando = false; this.desenhar(); },
  async finalizar() {
    await executar($("rcFinalizar"), async () => {
      const r = await api("POST", `/api/recebimentos/${this.ordem.recebimento.id}/finalizar`);
      await this.abrir();
      msg(`OK: ${r.numero} finalizada, entrada no estoque feita` + r.divergencias.map((d) => "\n⚠ " + d).join(""),
        r.divergencias.length ? "alerta" : "ok");
    });
  },
};

// ======================================================================= BAIXA (automática)
// Cada etiqueta lida é baixada NA HORA. Leu por engano? "desfazer" devolve ao estoque.
// Antena na potência máxima (100%), como na entrada e no inventário.
telas.baixa = {
  titulo: "Baixa",
  abrir() {
    this.baixadas = []; this.buffer = []; this.vistas = new Set(); this.pendentes = new Map();
    tela.innerHTML = `<div class="card">
        <label class="campo"><span>Motivo</span><select id="bxMotivo">${motivos.map((m) => `<option>${m}</option>`).join("")}</select></label>
        <label class="campo"><span>Local de onde sai</span><select id="bxLocal">${enderecos.map((e) =>
          `<option value="${e.id}" ${e.id === cfg.localBaixa ? "selected" : ""}>${esc(e.codigo)}</option>`).join("")}</select></label>
        <p class="fraco" style="margin:0">Aperte o gatilho perto das etiquetas: elas entram em <b>Para baixar</b>.
          Confira e toque em <b>Confirmar baixa</b>. Produto sem etiqueta: bipe o código de barras.</p></div>
      <div class="card"><h2>Para baixar <span class="dir"><span class="contador" id="bxPendCont">0</span></span></h2>
        <ul class="lista" id="bxPend"></ul>
        <div class="botoes" style="margin-top:8px"><button class="b" data-acao="limparPendentes">Limpar</button>
          <button class="b perigo" data-acao="confirmar" id="bxConfirmar" disabled>Confirmar baixa</button></div></div>
      <div class="card"><h2>Baixadas agora <span class="dir"><span class="contador" id="bxCont">0</span></span></h2>
        <ul class="lista" id="bxLista"></ul></div>`;
    $("bxLocal").addEventListener("change", () => {
      cfg.localBaixa = Number($("bxLocal").value); salvarCfg();
      // trocou o local: sai da lista o que é de outro local
      for (const [epc, t] of this.pendentes) if (t.endereco_id !== this.local()) { this.pendentes.delete(epc); this.vistas.delete(epc); }
      this.desenharPendentes();
    });
    this.desenharPendentes();
    this.desenhar();
  },
  local() { return Number($("bxLocal")?.value) || null; },
  desenharPendentes() {
    if (!$("bxPend")) return;
    const n = this.pendentes.size;
    $("bxPendCont").textContent = n;
    $("bxConfirmar").disabled = !n;
    $("bxConfirmar").textContent = n ? `Confirmar baixa (${n})` : "Confirmar baixa";
    $("bxPend").innerHTML = [...this.pendentes.values()].reverse().map((t) => `<li>
        <div class="info"><b>${esc(t.sku)}</b> <span class="fraco">${esc(t.descricao || "")}</span>
          <div class="mono fraco">${esc(t.epc)}</div></div>
        <button class="link" data-acao="tirar" data-valor="${esc(t.epc)}">tirar</button></li>`).join("")
      || `<li class="vazio">Nenhuma etiqueta lida</li>`;
  },
  tirar(_b, epc) { this.pendentes.delete(epc); this.vistas.delete(epc); this.desenharPendentes(); },
  limparPendentes() {
    for (const epc of this.pendentes.keys()) this.vistas.delete(epc);
    this.pendentes.clear(); this.desenharPendentes();
  },
  /** Só aqui a baixa é feita no sistema. */
  async confirmar(b) {
    const epcs = [...this.pendentes.keys()];
    if (!epcs.length) return;
    await executar(b, async () => {
      const r = await api("POST", "/api/baixas", { epcs, motivo: $("bxMotivo")?.value || "CONSUMO", endereco_id: this.local(), origem: "COLETOR", meio: "RFID" });
      const ok = r.tags.filter((t) => t.ok);
      for (const t of ok) this.baixadas.unshift({ epc: t.epc, ok: true, info: `${t.sku}${lotePonto(t.lote)}` });
      for (const t of r.tags) this.pendentes.delete(t.epc);   // a que falhou (já baixada em outro lugar) sai da lista
      const ignoradas = r.tags.length - ok.length;
      bipe("ok");   // bipe ao confirmar a baixa
      msg(`✓ ${ok.length} baixada(s)` + (ignoradas ? ` · ${ignoradas} ignorada(s)` : ""), "ok", false);
      this.desenharPendentes(); this.desenhar();
    });
  },
  desenhar() {
    if (!$("bxLista")) return;
    $("bxCont").textContent = this.baixadas.filter((b) => (b.ok && !b.desfeita) || b.qtd).length;
    $("bxLista").innerHTML = this.baixadas.slice(0, 100).map((b) => `<li class="${b.ok || b.qtd ? "" : "erro"}">
        <div class="info"><div ${b.desfeita ? 'style="text-decoration:line-through"' : ""}>${esc(b.info)}</div>
          <div class="mono fraco">${esc(b.epc)}${b.desfeita ? " · desfeita (voltou ao estoque)" : ""}</div></div>
        ${b.ok && !b.desfeita ? `<button class="link" data-acao="desfazer" data-valor="${esc(b.epc)}">desfazer</button>` : ""}</li>`).join("")
      || `<li class="vazio">Nenhuma etiqueta baixada ainda</li>`;
  },
  // Produto sem etiqueta: bipa o código de barras, informa a quantidade e sai por FEFO
  async codigo(c) {
    await executar(null, async () => {
      const p = await buscarProduto(c);
      this.produto = p;
      $("bxQtdCard")?.remove();
      $("bxLista").closest(".card").insertAdjacentHTML("beforebegin", `<div class="card" id="bxQtdCard"><h2>Baixa por quantidade</h2>
        <div class="produto">${esc(p.sku)}</div><div class="fraco">${esc(p.descricao)} · sai de ${esc($("bxLocal")?.selectedOptions[0]?.text || "")}</div>
        <label class="campo" style="margin-top:6px"><span>Quantidade</span><input id="bxQtd" inputmode="decimal" enterkeyhint="done" data-enter="baixarQtd"></label>
        <div class="botoes"><button class="b" data-acao="fecharQtd">Cancelar</button><button class="b perigo" data-acao="baixarQtd" id="bxQtdBotao">Baixar</button></div></div>`);
      digitar($("bxQtd"));
    });
  },
  fecharQtd() { $("bxQtdCard")?.remove(); this.produto = null; },
  async baixarQtd() {
    const q = numero($("bxQtd")?.value);
    if (!(q > 0)) return msg("Informe a quantidade", "alerta");
    await executar($("bxQtdBotao"), async () => {
      const r = await api("POST", "/api/baixas", { produto_id: this.produto.id, quantidade: q, motivo: $("bxMotivo").value, endereco_id: this.local(), origem: "COLETOR", meio: "BARRAS" });
      for (const l of r.lotes) this.baixadas.unshift({ epc: `${num(l.quantidade)} un. por código de barras`, ok: false, qtd: true, info: `${this.produto.sku}${lotePonto(l.lote)}` });
      msg(`✓ Baixa de ${num(q)} ${this.produto.sku}`);
      this.fecharQtd(); this.desenhar();
    });
  },
  rfid(epc) {
    if (this.vistas.has(epc)) return;   // a mesma etiqueta só vale uma vez nesta tela
    this.vistas.add(epc);
    this.buffer.push(epc);
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.conferir(), 250);
  },
  /** Etiquetas lidas: confere no servidor (sem baixar) e põe em "Para baixar" as que estão
   *  em estoque no local escolhido. As outras são ignoradas em silêncio. */
  async conferir() {
    const epcs = this.buffer; this.buffer = [];
    if (!epcs.length) return;
    const local = this.local();
    await Promise.all(epcs.map(async (epc) => {
      try {
        const t = await api("GET", "/api/tags/" + encodeURIComponent(epc));
        if (t.status === "ATIVA" && (!local || t.endereco_id === local) && !this.pendentes.has(t.epc)) {
          this.pendentes.set(t.epc, t);
          bipe("ok");   // bipe a cada etiqueta que entra em "Para baixar" (igual à Entrada)
        }
      } catch (e) {
        if (/conex|Wi-Fi/i.test(e.message)) { this.vistas.delete(epc); msg(e.message, "erro"); }   // sem rede: pode ler de novo
      }
    }));
    if (telaAtual === "baixa") this.desenharPendentes();
  },
  async desfazer(b, epc) {
    await executar(b, async () => {
      await api("POST", `/api/tags/${encodeURIComponent(epc)}/estornar`);
      const x = this.baixadas.find((y) => y.epc === epc && y.ok);
      if (x) x.desfeita = true;
      this.vistas.delete(epc);
      this.desenhar();
      msg("Desfeito: a etiqueta voltou ao estoque", "info");
    });
  },
};

// ======================================================================= INVENTÁRIO (RFID)
// Inicia aqui mesmo, sai lendo; cada leitura vai na hora para o servidor.
// Finalizar: etiqueta em estoque que não foi lida sai (falta); etiqueta achada volta (sobra).
telas.inventario = {
  titulo: "Inventário",
  async abrir() {
    this.inv = null; this.buffer = []; this.confirmando = false;

  async abrirInv(_b, id) {

    });
  },
  desenhar() {
    const d = this.inv, c = d.confronto;
    const sistema = c.reduce((s, x) => s + x.sistema, 0), contado = c.reduce((s, x) => s + x.contado, 0);
    const faltando = c.reduce((s, x) => s + Math.max(x.sistema - x.contado, 0), 0);
    const sobras = c.reduce((s, x) => s + Math.max(x.contado - x.sistema, 0), 0);
    tela.innerHTML = `<div class="card"><h2>${esc(d.inventario.nome)} <span class="dir"><span class="contador">${num(contado)}/${num(sistema)}</span></span></h2>
        ${barraProgresso(Math.min(contado, sistema), sistema)}
        <div class="duas" style="margin-top:8px;text-align:center">
          <div><div class="contador" style="color:var(--alerta)">${num(faltando)}</div><div class="fraco">faltando</div></div>
          <div><div class="contador" style="color:var(--primaria)">${num(sobras)}</div><div class="fraco">sobrando</div></div>
        </div></div>
      <div class="card"><h2>Por produto</h2><ul class="lista">
        ${c.map((x) => `<li><div class="info"><b>${esc(x.sku)}</b>${lotePonto(x.lote)}<div class="fraco">${esc(x.descricao)}</div>
            ${barraProgresso(Math.min(x.contado, x.sistema), x.sistema)}</div>
          <span class="qtd" style="color:${x.contado < x.sistema ? "var(--alerta)" : x.contado > x.sistema ? "var(--primaria)" : "var(--sucesso)"}">${num(x.contado)}/${num(x.sistema)}</span></li>`).join("")
          || `<li class="vazio">Nenhuma etiqueta em estoque</li>`}</ul></div>
      ${(() => {
        const pendentes = (d.etiquetas || []).filter((e) => e.desconhecida && !e.incluida_em).length;
        return pendentes ? `<div class="card" style="border-color:var(--alerta)"><h2>${pendentes} etiqueta(s) a mais não cadastrada(s)</h2>
          <label class="campo"><span>Incluir no estoque como</span><select id="ivSobraProduto">
            <option value="">— de qual produto são? —</option>${produtos.filter((p) => p.ativo).map((p) => `<option value="${p.id}">${esc(p.sku)} · ${esc(p.descricao)}</option>`).join("")}</select></label>
          <div class="botoes"><button class="b primario" data-acao="incluirSobras" id="ivIncluir">Incluir no estoque</button></div></div>` : "";
      })()}
      <div class="card"><h2>Etiquetas <span class="dir fraco">vermelho = diferença</span></h2><ul class="lista">
        ${(d.etiquetas || []).slice(0, 300).map((e) => `<li><div class="info">
            <div class="mono" style="${e.situacao === "OK" ? "" : "color:var(--perigo);font-weight:700"}">${esc(e.epc)}</div>
            <div class="fraco">${e.incluida_em ? "sobra · incluída no estoque (" + esc(e.sku) + ")" : e.desconhecida ? "sobra · etiqueta não cadastrada" : esc(e.sku) + " · " + (e.situacao === "OK" ? "lida" : e.situacao === "FALTA" ? "falta (não lida)" : "sobra (não estava em estoque)")}</div></div></li>`).join("")
          || `<li class="vazio">Nenhuma etiqueta</li>`}</ul></div>
      ${this.confirmando ? `<div class="card" style="border-color:var(--alerta)"><h2>Finalizar inventário?</h2>
          <p style="margin:0 0 8px">O estoque passa a ser o que foi lido:<br>
            <b>${num(faltando)}</b> etiqueta(s) não lida(s) saem do estoque; <b>${num(sobras)}</b> achada(s) voltam.</p>
          <div class="botoes"><button class="b" data-acao="voltarConfirmar">Voltar</button><button class="b sucesso" data-acao="finalizar" id="ivFinalizar">Confirmar</button></div></div>`
        : `<div class="botoes"><button class="b" data-acao="abrir">Inventários</button><button class="b sucesso" data-acao="pedirFinalizar">Finalizar</button></div>`}`;
  },
  rfid(epc) {
    if (!this.inv) return msg("Toque em um inventário ou em Novo inventário", "alerta");
    this.buffer.push(epc);
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.enviar(), 300);
  },
  async enviar() {
    const epcs = [...new Set(this.buffer)]; this.buffer = [];
    if (!epcs.length || !this.inv) return;
    const id = this.inv.inventario.id;
    try {
      const r = await api("POST", `/api/inventarios/${id}/contagens`, { epcs, origem: "COLETOR", meio: "RFID" });
      const novas = r.tags.filter((t) => t.ok && !t.repetida).length, erros = r.tags.filter((t) => !t.ok).length;
      if (novas) msg(`✓ ${novas} etiqueta(s) contada(s)` + (erros ? ` · ${erros} ignorada(s)` : ""));
      if (telaAtual === "inventario" && this.inv?.inventario.id === id && !this.confirmando) await this.abrirInv(null, id);

  pedirFinalizar() { this.confirmando = true; this.desenhar(); },
  voltarConfirmar() { this.confirmando = false; this.desenhar(); },
  async incluirSobras() {

      msg(`✓ ${r.incluidas} etiqueta(s) incluída(s) no estoque como ${r.sku}`);
    });
  },
  async finalizar() {
    await executar($("ivFinalizar"), async () => {
      const r = await api("POST", `/api/inventarios/${this.inv.inventario.id}/fechar`);
      await this.abrir();
      msg(`Inventário finalizado: ${num(r.faltas ?? 0)} falta(s) e ${num(r.sobras ?? 0)} sobra(s)` +
        (r.desconhecidas ? `
${num(r.desconhecidas)} etiqueta(s) não cadastrada(s): dê entrada por uma ordem de recebimento` : ""));
    });
  },
};

// ======================================================================= LOCALIZAR ETIQUETA (quente/frio)
// Escolha a etiqueta, aperte e segure o gatilho e vá andando: quanto mais perto,
// mais cheia e mais vermelha a barra, e mais rápido o bipe (como um detector).
telas.localizar = {
  titulo: "Localizar etiqueta",
  abrir() {
    this.alvo = null; this.valor = 0; this.ultimo = 0; this.procurando = false;
    tela.innerHTML = `<div class="card">
        <label class="campo"><span>Número da etiqueta (EPC)</span>
          <input id="lcEpc" class="mono" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Digite ou escolha na lista" data-enter="definir"></label>
        <div class="botoes"><button class="b primario" data-acao="definir">Procurar esta etiqueta</button></div></div>
      <div id="lcCorpo"></div>`;
    this.lista();
  },
  async lista() {
    try {
      const tags = await api("GET", "/api/tags?status=ATIVA&limite=500");
      if (telaAtual !== "localizar" || this.alvo || !$("lcCorpo")) return;
      $("lcCorpo").innerHTML = `<div class="card"><h2>Etiquetas em estoque</h2>
        <input id="lcBusca" placeholder="Filtrar por produto ou final do EPC" style="margin-bottom:6px">
        <ul class="lista" id="lcLista"></ul></div>`;
      const desenhar = () => {
        const f = $("lcBusca").value.trim().toUpperCase();
        $("lcLista").innerHTML = tags.filter((t) => !f || [t.sku, t.descricao, t.lote, t.epc].some((v) => String(v).toUpperCase().includes(f))).slice(0, 80)
          .map((t) => `<li class="clicavel" data-acao="escolher" data-valor="${esc(t.epc)}"><div class="info"><b>${esc(t.sku)}</b>${lotePonto(t.lote)}
            <div class="mono fraco">${esc(t.epc)}</div></div></li>`).join("") || `<li class="vazio">Nenhuma etiqueta</li>`;
      };
      $("lcBusca").addEventListener("input", desenhar);
      desenhar();
    } catch (e) { msg(e.message, "erro"); }
  },
  escolher(_b, epc) { $("lcEpc").value = epc; this.definir(); },
  async definir() {
    const epc = $("lcEpc").value.trim().toUpperCase();
    if (!/^[0-9A-F]{8,}$/.test(epc)) return msg("Número de etiqueta inválido (EPC em hexadecimal)", "erro");
    if (!app) return msg("Localizar funciona no app do coletor (leitor RFID)", "alerta");
    this.alvo = epc; this.valor = 0;
    try { app.localizar(epc); } catch { return msg("Atualize o ColetorWMS.apk para usar o Localizar", "erro"); }
    definirGatilho("rfid");
    let info = "";
    try { const t = await api("GET", "/api/tags/" + encodeURIComponent(epc)); info = `${t.sku}${lotePonto(t.lote)}`; } catch { info = "etiqueta não cadastrada no sistema"; }
    $("lcCorpo").innerHTML = `<div class="card" style="text-align:center">
        <div class="mono">${esc(epc)}</div><div class="fraco">${esc(info)}</div>
        <div class="radar"><div class="radar-barra" id="lcBarra"></div></div>
        <div class="contador" id="lcValor">—</div><div id="lcTexto" class="fraco">Aperte e segure o gatilho e vá andando</div>
        <div class="botoes" style="margin-top:10px"><button class="b" data-acao="alternar" id="lcBotao">▶ Procurar sem o gatilho</button>
          <button class="b" data-acao="abrir">Trocar etiqueta</button></div></div>`;
    this.pintar();
  },
  alternar() {
    this.procurando = !this.procurando;
    try { app.procurar(this.procurando); } catch {}
    $("lcBotao").textContent = this.procurando ? "■ Parar" : "▶ Procurar sem o gatilho";
  },
  proximidade(v) {
    if (v < 0) { this.valor = 0; this.ultimo = 0; this.pintar("parado"); return; }
    this.valor = v; this.ultimo = performance.now(); this.pintar();
  },
  pintar(estado) {
    const barra = $("lcBarra"); if (!barra) return;
    const v = this.valor;
    barra.style.width = v + "%";
    barra.style.background = `hsl(${Math.round(220 - 2.2 * v)}, 85%, 50%)`;   // azul (frio) → vermelho (quente)
    $("lcValor").textContent = estado === "parado" || !this.ultimo ? "—" : v + "%";
    $("lcTexto").textContent = estado === "parado" ? "Parado. Aperte o gatilho para procurar."
      : !this.ultimo ? "Aperte e segure o gatilho e vá andando"
      : v >= 80 ? "🔥 Muito quente: está aqui!" : v >= 50 ? "Quente" : v >= 20 ? "Morno" : "❄ Frio";
  },
  // Bipe tipo detector: mais perto = mais rápido e mais agudo. Sem sinal há 0,8 s = esfria.
  tique() {
    if (telaAtual !== "localizar" || !this.alvo) return;
    const agora = performance.now();
    if (this.ultimo && agora - this.ultimo > 800) { this.valor = Math.max(0, this.valor - 10); this.pintar(); }
    if (this.ultimo && this.valor > 0 && agora - (this.ultimoBipe || 0) > 1000 - 9 * this.valor) {
      this.ultimoBipe = agora;
      try {
        audio = audio || new AudioContext();
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = "square"; o.frequency.value = 600 + 12 * this.valor; g.gain.value = ganhoBipe();
        o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.05);
      } catch {}
    }
  },
  sair() {
    this.alvo = null; this.procurando = false;
    try { app?.localizar(""); } catch {}
  },
};
window.proximidadeRfid = (v) => telas.localizar.proximidade(Number(v));
setInterval(() => telas.localizar.tique(), 50);
