<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="light dark">
<title>WMS Coletor</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icone.svg">
<!--
  Tela do coletor pelo navegador (Zebra MC3390R / MC3330R com Chrome).

  Como as leituras chegam aqui:
    DataWedge (perfil associado ao Chrome) com "Barcode input" e "RFID input"
    ligados e "Keystroke output" mandando os dados + ENTER. Ou seja, o
    DataWedge "digita" cada código de barras e cada EPC lido.

  A página guarda as leituras no campo "Leitura" (sem teclado virtual) e,
  se o dado cair em outro campo (ex.: Lote), percebe que veio do leitor
  (chegou de uma vez ou muito rápido) e tira de lá.

  Classificação da leitura:
    - EPC RFID ....: hexadecimal com 16 ou mais caracteres
    - Endereço ....: igual ao código de um endereço cadastrado (etiqueta da prateleira)
    - Produto .....: qualquer outra coisa (EAN ou SKU)

  Toda regra (FEFO, saldo, validade, data/hora) continua no servidor.

  Dentro do app "Coletor WMS" (Android, pasta coletor/):
    - o RFID é lido pelo app (SDK Zebra) e chega aqui por leituraRfid(epc);
    - a página fala com o app pelo objeto ColetorApp: gatilhoRfid(true/false)
      escolhe o que o gatilho lê e potencia(%) ajusta a antena;
    - o código de barras continua vindo pelo DataWedge.

  Tela do coletor:
    - Tela cheia: no primeiro toque a página esconde a barra de endereços do
      Chrome (opção no botão ⚙). Instalada como app ("Adicionar à tela
      inicial" com a origem liberada no chrome://flags) já abre sem a barra.
    - Teclado virtual: fica escondido enquanto só se lê com o gatilho. Aparece
      nos campos de digitação (lote, quantidade...) e no botão ⌨.
-->
<style>
  :root {
    --bg: #eef1f5; --painel: #fff; --borda: #d8dee6; --texto: #17202b; --texto-2: #5c6778;
    --topo: #16263a; --primaria: #1f6feb; --perigo: #c62828; --sucesso: #2e7d32; --alerta: #b26a00;
    --fundo-perigo: #fdecea; --fundo-sucesso: #e8f5e9; --fundo-alerta: #fff4e0; --fundo-info: #e3f2fd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1520; --painel: #172130; --borda: #2a3748; --texto: #e4eaf2; --texto-2: #9aa8ba; --topo: #0b111a;
            --primaria: #3d8bfd; --perigo: #ef5350; --sucesso: #66bb6a; --alerta: #ffb74d;
            --fundo-perigo: #3a1d1f; --fundo-sucesso: #1b3320; --fundo-alerta: #3a2c14; --fundo-info: #13304a; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  body { background: var(--bg); color: var(--texto); font: 15px/1.35 Roboto, "Segoe UI", system-ui, Arial, sans-serif; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }

  header { background: var(--topo); color: #fff; display: flex; align-items: center; gap: 6px; padding: 0 6px; height: 50px; flex: none; }
  header h1 { font-size: 18px; margin: 0; flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { background: none; border: none; color: #fff; font-size: 22px; width: 42px; height: 42px; border-radius: 50%; }
  header button:active { background: #ffffff22; }
  /* Barra de status (hora, Wi-Fi, bateria): só em tela cheia, quando o Android esconde a dele */
  .status { display: none; align-items: center; gap: 10px; height: 24px; padding: 0 10px; background: #000; color: #fff; font: 600 13px Roboto, Arial, sans-serif; flex: none; }
  .status, .status span, .status svg { color: #fff !important; }
  .tela-cheia .status { display: flex; }
  .status .dir { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .status svg { display: block; }
  #bateria { display: flex; align-items: center; gap: 3px; }
  #bateria[hidden] { display: none; }
  .wifi-off .arco { opacity: .25; }
  .status #iconeWifi.baixo { color: #ffb74d !important; }
  .status #iconeWifi.off { color: #ef5350 !important; }
  #btTelaCheia[hidden] { display: none; }

  .leitura { display: flex; gap: 6px; padding: 6px 8px; background: var(--painel); border-bottom: 1px solid var(--borda); flex: none; }
  .leitura textarea { flex: 1; resize: none; height: 38px; padding: 8px 10px; font: 15px Consolas, monospace; border: 2px dashed var(--borda); border-radius: 8px; background: var(--bg); color: var(--texto); overflow: hidden; white-space: nowrap; }
  .leitura textarea:focus { outline: none; border-color: var(--primaria); border-style: solid; }
  .leitura #modo { width: auto; padding: 0 8px; font: 700 13px Roboto, Arial, sans-serif; white-space: nowrap; }
  .leitura #modo.rfid { background: var(--fundo-info); border-color: var(--primaria); color: var(--primaria); }
  .leitura #modo.lendo { background: var(--primaria); color: #fff; animation: pulsa .6s infinite alternate; }
  @keyframes pulsa { to { opacity: .6; } }
  .leitura #modo.barras { background: var(--fundo-alerta); border-color: var(--alerta); color: var(--alerta); }
  .leitura button { width: 42px; border: 1px solid var(--borda); border-radius: 8px; background: var(--painel); color: var(--texto); font-size: 18px; }

  main { flex: 1; overflow-y: auto; padding: 8px 8px 16px; }
  .grade-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; min-height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 15px; color: var(--texto); position: relative; padding: 8px; }
  .tile:active { background: var(--fundo-info); }
  .tile .ic { font-size: 28px; line-height: 1; }
  .tile .badge { position: absolute; top: 6px; right: 8px; background: var(--alerta); color: #fff; border-radius: 10px; font-size: 12px; padding: 0 7px; }
  .tile .badge:empty { display: none; }

  .card { background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-2); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
  .card h2 .dir { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .dica { color: var(--texto-2); text-align: center; padding: 14px 8px; border: 2px dashed var(--borda); border-radius: 10px; font-size: 14px; }
  .dica b { color: var(--texto); }
  .produto { font-size: 16px; font-weight: 700; }
  .fraco { color: var(--texto-2); font-size: 13px; font-weight: 400; }
  .mono { font-family: Consolas, monospace; font-size: 12.5px; word-break: break-all; }

  label.campo { display: block; margin-bottom: 8px; }
  label.campo > span { display: block; font-size: 12px; font-weight: 600; color: var(--texto-2); margin-bottom: 3px; }
  input, select { width: 100%; font: 16px Roboto, "Segoe UI", Arial, sans-serif; padding: 9px 10px; border: 1px solid var(--borda); border-radius: 8px; background: var(--painel); color: var(--texto); min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--primaria); outline-offset: -1px; }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .botoes { display: flex; gap: 8px; margin-top: 4px; }
  .botoes > * { flex: 1; }
  button.b { font: 700 15px Roboto, "Segoe UI", Arial, sans-serif; min-height: 50px; border-radius: 10px; border: 1px solid var(--borda); background: var(--painel); color: var(--texto); padding: 6px 10px; }
  button.b:active { filter: brightness(.92); }
  button.b:disabled { opacity: .45; }
  button.primario { background: var(--primaria); border-color: var(--primaria); color: #fff; }
  button.perigo { background: var(--perigo); border-color: var(--perigo); color: #fff; }
  button.sucesso { background: var(--sucesso); border-color: var(--sucesso); color: #fff; }
  button.link { background: none; border: none; color: var(--primaria); font: 600 14px inherit; padding: 4px; }

  .lista { list-style: none; margin: 0; padding: 0; }
  .lista li { display: flex; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px solid var(--borda); }
  .lista li:last-child { border-bottom: none; }
  .lista li .info { flex: 1; min-width: 0; }
  .lista li .qtd { font-weight: 700; font-size: 16px; white-space: nowrap; }
  .lista li.ok { background: var(--fundo-sucesso); }
  .lista li.erro .info { color: var(--perigo); }
  .lista li.clicavel:active { background: var(--fundo-info); }
  .x { border: none; background: none; color: var(--texto-2); font-size: 20px; width: 34px; height: 34px; flex: none; }
  .check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--borda); flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; }
  li.ok .check { background: var(--sucesso); border-color: var(--sucesso); }
  .contador { font-size: 26px; font-weight: 800; }
  .selo { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 11.5px; font-weight: 700; background: var(--bg); color: var(--texto-2); white-space: nowrap; }
  .selo.perigo { background: var(--fundo-perigo); color: var(--perigo); } .selo.alerta { background: var(--fundo-alerta); color: var(--alerta); }
  .selo.sucesso { background: var(--fundo-sucesso); color: var(--sucesso); } .selo.info { background: var(--fundo-info); color: var(--primaria); }
  .vazio { color: var(--texto-2); text-align: center; padding: 10px; font-size: 14px; }

  dialog { border: none; border-radius: 12px; padding: 16px; width: min(340px, calc(100vw - 24px)); background: var(--painel); color: var(--texto); box-shadow: 0 16px 40px #0007; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h3 { margin: 0 0 10px; font-size: 17px; }
  dialog .botoes { margin-top: 12px; }
  #msg { flex: none; padding: 10px 12px; font-size: 15px; font-weight: 600; white-space: pre-line; display: none; border-top: 3px solid; max-height: 35vh; overflow-y: auto; }
  #msg.ok { display: block; background: var(--fundo-sucesso); border-color: var(--sucesso); color: var(--texto); }
  #msg.erro { display: block; background: var(--fundo-perigo); border-color: var(--perigo); color: var(--texto); }
  #msg.alerta { display: block; background: var(--fundo-alerta); border-color: var(--alerta); color: var(--texto); }
  #msg.info { display: block; background: var(--fundo-info); border-color: var(--primaria); color: var(--texto); }
</style>
</head>
<body>
<div class="status" id="status">
  <span id="hora">--:--</span>
  <span class="dir">
    <span id="iconeWifi" title="Conexão com o servidor">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path class="arco a3" d="M1 5a11.5 11.5 0 0 1 16 0"/><path class="arco a2" d="M3.5 7.8a8 8 0 0 1 11 0"/>
        <path class="arco a1" d="M6.2 10.4a4 4 0 0 1 5.6 0"/><circle class="arco a0" cx="9" cy="12.6" r="1" fill="currentColor" stroke="none"/>
        <path class="corte" d="M2 1l14 12" stroke="#ef5350" style="display:none"/>
      </svg>
    </span>
    <span id="bateria" hidden title="Bateria">
      <span id="bateriaPct"></span>
      <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.75" y="0.75" width="19.5" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect x="21" y="3.5" width="2.2" height="5" rx="1" fill="currentColor"/>
        <rect id="bateriaNivel" x="2.5" y="2.5" width="16" height="7" rx="1" fill="currentColor"/>
        <path id="bateriaRaio" d="M11.5 1.5L7.5 6.5h3l-1.5 4 4.5-5.5h-3z" fill="#000" stroke="#000" stroke-width=".6" style="display:none"/></svg>
    </span>
  </span>
</div>
<header>
  <button id="voltar" aria-label="Voltar" style="visibility:hidden">←</button>
  <h1 id="titulo">WMS Coletor</h1>
  <button id="btTelaCheia" aria-label="Tela cheia" title="Tela cheia" hidden>⛶</button>
  <button id="btConfig" aria-label="Configurar servidor" title="Servidor">⚙</button>
</header>
<div class="leitura">
  <textarea id="leitura" rows="1" inputmode="none" autocomplete="off" autocapitalize="characters" spellcheck="false"
            placeholder="Leitura: aperte o gatilho"></textarea>
  <button id="modo" class="rfid" title="O que o gatilho lê" hidden>📡 RFID</button>
  <button id="teclado" title="Digitar código manualmente">⌨</button>
</div>
<main id="tela"></main>
<div id="msg" role="status"></div>

<!-- Botão ⚙: configuração do servidor -->
<dialog id="dlgServidor"><form method="dialog" id="formServidor">
  <h3>Endereço do servidor (PC)</h3>
  <input id="edServidor" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="http://192.168.0.10:8000">
  <p class="fraco" id="dlgInfo"></p>
  <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="edTelaCheia" style="width:auto"> Tela cheia (esconder a barra do Chrome)</label>
  <p class="fraco" id="dlgInstalar" style="margin-top:8px"></p>
  <div class="botoes"><button class="b" type="button" id="dlgCancelar">Cancelar</button><button class="b primario" type="submit">Salvar</button></div>
</form></dialog>

<script>
"use strict";
// ======================================================================= utilidades
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => Number(v ?? 0).toLocaleString("pt-BR", { maximumFractionDigits: 3 });
const dataBR = (d) => (d ? d.slice(0, 10).split("-").reverse().join("/") : "-");
const numero = (texto) => { const v = parseFloat(String(texto).replace(",", ".")); return Number.isFinite(v) ? v : NaN; };

async function api(metodo, url, corpo) {
  let r;
  try {
    r = await fetch(url, { method: metodo, headers: { "Content-Type": "application/json" }, body: corpo ? JSON.stringify(corpo) : undefined });
  } catch {
    sinalWifi(null);
    throw new Error("Sem conexão com o servidor. Confira o Wi-Fi.");
  }
  if (!conectado) sinalWifi(1);
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof dados.detail === "string" ? dados.detail : "Erro no servidor");
  return dados;
}

// ---- retorno para o operador: mensagem, bipe e vibração
let audio;
function bipe(tipo) {
  try {
    audio = audio || new AudioContext();
    const tons = tipo === "erro" ? [[330, 0], [260, 0.16]] : tipo === "alerta" ? [[880, 0], [880, 0.14]] : [[1800, 0]];
    tons.forEach(([f, atraso]) => {
      const o = audio.createOscillator(), v = audio.createGain();
      o.frequency.value = f; v.gain.value = 0.08;
      o.connect(v).connect(audio.destination);
      o.start(audio.currentTime + atraso); o.stop(audio.currentTime + atraso + 0.12);
    });
  } catch {}
  if (tipo === "erro" && navigator.vibrate) navigator.vibrate([120, 60, 120]);
}
let timerMsg;
function msg(texto, tipo = "ok", som = true) {
  const m = $("msg");
  m.className = texto ? tipo : "";
  m.textContent = texto || "";
  if (texto && som) bipe(tipo);
  clearTimeout(timerMsg);
  if (texto && tipo === "ok") timerMsg = setTimeout(() => (m.className = ""), 6000);
}
/** Roda uma ação no servidor: trava o botão e mostra o erro com bipe. */
async function executar(botao, acao) {
  if (botao) botao.disabled = true;
  try { return await acao(); }
  catch (e) { msg(e.message, "erro"); }
  finally { if (botao) botao.disabled = false; }
}

// ======================================================================= app do coletor (Android)
// No app "Coletor WMS" o WebView cria window.ColetorApp. No simulador (/coletor) a página
// roda num iframe e o simulador oferece um ColetorAppSimulado. No Chrome: null.
const app = (() => {
  try { return window.ColetorApp || (window.parent !== window && window.parent.ColetorAppSimulado) || null; } catch { return null; }
})();
let modoGatilho = "rfid", potenciaAtual = 100;
/** O gatilho do MC33xxR é um só: lê RFID ou código de barras (a chave ao lado do campo Leitura). */
function definirGatilho(modo) {
  if (!app) return;
  modoGatilho = modo;
  try { app.gatilhoRfid(modo === "rfid"); } catch {}
  $("modo").textContent = modo === "rfid" ? "📡 RFID" : "▮▮ Código";
  $("modo").className = modo;
}
function definirPotencia(pct) {
  potenciaAtual = pct;
  try { app?.potencia(pct); } catch {}
}
if (app) {
  $("modo").hidden = false;
  $("modo").addEventListener("click", (ev) => {
    ev.stopPropagation();
    definirGatilho(modoGatilho === "rfid" ? "barras" : "rfid");
    msg(modoGatilho === "rfid" ? "Gatilho lê etiquetas RFID" : "Gatilho lê código de barras", "info", false);
  });
}
/** O app avisa quando o gatilho é apertado/solto em modo RFID (mostra "Lendo…" na chave). */
window.gatilhoRfidEvento = (apertado) => {
  const lendo = apertado === "1";
  $("modo").textContent = lendo ? "📡 Lendo…" : modoGatilho === "rfid" ? "📡 RFID" : "▮▮ Código";
  $("modo").classList.toggle("lendo", lendo);
};
/** O app chama a cada etiqueta lida pelo RFID. */
window.leituraRfid = (epc) => {
  const dado = String(epc).trim().toUpperCase();
  if (!dado) return;
  leitura.placeholder = "Última: " + dado;
  const t = telas[telaAtual];
  if (t.rfid) t.rfid(dado); else msg("Esta tela não usa RFID", "alerta");
};
/** O app avisa quando o leitor RFID conecta (ou não): reaplica o modo do gatilho e a potência. */
window.statusRfid = (texto) => {
  const ok = !/indispon|erro|não /i.test(texto);
  msg(texto, ok ? "info" : "erro", !ok);
  if (ok) { definirGatilho(modoGatilho); definirPotencia(potenciaAtual); }
};

// ======================================================================= captura das leituras (DataWedge)
const leitura = $("leitura");
const ehEpc = (v) => /^[0-9A-F]{16,}$/i.test(v) && !/^\d{8,14}$/.test(v);
const ehEditavel = (el) => el && el.matches && el.matches("input:not([type=checkbox]):not([type=radio]):not([type=date]), textarea") && el !== leitura;

function processarLeitura(bruto) {
  const dado = String(bruto).trim().toUpperCase();
  if (!dado) return;
  leitura.placeholder = "Última: " + dado;
  const t = telas[telaAtual];
  if (ehEpc(dado)) {
    if (t.rfid) t.rfid(dado); else msg("Esta tela não usa RFID", "alerta");
  } else if (enderecos.some((e) => e.codigo === dado) && t.endereco) {
    t.endereco(enderecos.find((e) => e.codigo === dado));
  } else if (t.codigo) {
    t.codigo(dado);
  } else {
    msg("Leitura não usada nesta tela: " + dado, "alerta");
  }
}

// 1) Campo "Leitura": cada linha (dado + ENTER) é uma leitura.
leitura.addEventListener("input", () => {
  if (!leitura.value.includes("\n")) return;
  const partes = leitura.value.split(/\r?\n/);
  leitura.value = partes.pop();
  partes.forEach(processarLeitura);
});
leitura.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter") return;
  ev.preventDefault();
  const v = leitura.value; leitura.value = "";
  if (leitura.inputMode !== "none") tecladoManual(false);   // leitura digitada: fecha o teclado
  v.split(/\r?\n/).forEach(processarLeitura);
});

// 2) Leitura que caiu em outro campo (ex.: Lote): chegou de uma vez só...
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (!ehEditavel(el)) return;
  const antes = el.dataset.antes ?? "";
  if (ev.inputType !== "insertFromPaste" && el.value.length - antes.length >= 6 && el.value.startsWith(antes)) {
    el.dataset.pendente = el.value.slice(antes.length);   // o ENTER que vem em seguida confirma que é do leitor
    el.dataset.base = antes;
  }
  el.dataset.antes = el.value;
}, true);
// ...ou tecla por tecla, rápido demais para ser gente digitando.
let rajada = { el: null, n: 0, ultimo: 0, base: "" };
document.addEventListener("keydown", (ev) => {
  const el = ev.target;
  if (!ehEditavel(el)) return;
  const t = performance.now();
  if (ev.key.length === 1) {
    if (rajada.el !== el || t - rajada.ultimo > 45) rajada = { el, n: 0, base: el.value };
    rajada.n++; rajada.ultimo = t;
    return;
  }
  if (ev.key !== "Enter") return;
  let dado = null;
  if (el.dataset.pendente) { dado = el.dataset.pendente; el.value = el.dataset.base; }
  else if (rajada.el === el && rajada.n >= 6 && t - rajada.ultimo < 120) { dado = el.value.slice(rajada.base.length); el.value = rajada.base; }
  delete el.dataset.pendente;
  rajada = { el: null, n: 0, ultimo: 0, base: "" };
  el.dataset.antes = el.value;
  ev.preventDefault();
  if (dado) processarLeitura(dado);
  else if (el.dataset.enter) telas[telaAtual][el.dataset.enter]?.();   // ENTER digitado pelo operador
}, true);

// 3) Mantém o foco no campo Leitura (sem abrir o teclado virtual) quando não há outro campo em uso.
const teclado = navigator.virtualKeyboard;   // Chrome 94+: controle do teclado virtual (se não existir, o Android decide sozinho)
function focarLeitura() {
  if (document.querySelector("dialog[open]")) return;
  if (!ehEditavel(document.activeElement) && document.activeElement?.tagName !== "SELECT") {
    leitura.focus({ preventScroll: true });
    if (leitura.inputMode === "none") teclado?.hide();
  }
}
document.addEventListener("click", () => setTimeout(focarLeitura, 0));
document.addEventListener("focusout", () => setTimeout(focarLeitura, 50));
document.addEventListener("change", (ev) => { if (ev.target.tagName === "SELECT") setTimeout(() => leitura.focus({ preventScroll: true }), 50); });

// 4) Teclado virtual só quando precisa digitar: campos de digitação (lote, quantidade...) e o botão ⌨.
document.addEventListener("focusin", (ev) => {
  const el = ev.target;
  if (!ehEditavel(el) && !(el === leitura && leitura.inputMode !== "none")) return;
  el.setAttribute("virtualkeyboardpolicy", "manual");
  teclado?.show();
  setTimeout(() => el.scrollIntoView({ block: "center", behavior: "smooth" }), 250);   // não deixa o campo atrás do teclado
});
/** Leva o operador para um campo de digitação e abre o teclado (numérico em quantidade). */
function digitar(el) {
  if (!el) return;
  el.focus();
  teclado?.show();
}
function tecladoManual(ligar) {
  leitura.inputMode = ligar ? "text" : "none";
  $("teclado").style.background = ligar ? "var(--fundo-info)" : "";
  leitura.placeholder = ligar ? "Digite o código e toque em Enter" : "Leitura: aperte o gatilho";
  leitura.blur(); leitura.focus();
  if (ligar) teclado?.show(); else teclado?.hide();
}
$("teclado").addEventListener("click", (ev) => { ev.stopPropagation(); tecladoManual(leitura.inputMode === "none"); });

// 5) Tela cheia: esconde a barra de endereços do Chrome. O navegador só deixa entrar
//    em tela cheia depois de um toque, e o Chrome do Android sai dela sozinho em alguns
//    casos (voltar, teclado virtual, seletor de data/lista). Por isso a página pede de novo
//    a cada toque ou tecla. Instalada como app (ícone na tela inicial), não há barra nenhuma.
const instaladoComoApp = () => matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches && !document.fullscreenElement;
let querTelaCheia = true;
try { querTelaCheia = localStorage.getItem("coletor.telaCheia") !== "0"; } catch {}
if (app) querTelaCheia = false;   // o app já abre sem barra do Chrome
function entrarTelaCheia() {
  if (!querTelaCheia || document.fullscreenElement || instaladoComoApp() || !document.documentElement.requestFullscreen) return;
  document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
}
["click", "touchend", "pointerup"].forEach((tipo) => document.addEventListener(tipo, entrarTelaCheia, true));
document.addEventListener("keydown", (ev) => { if (ev.key !== "Escape") entrarTelaCheia(); }, true);
$("btTelaCheia").addEventListener("click", (ev) => { ev.stopPropagation(); querTelaCheia = true; entrarTelaCheia(); });

// ======================================================================= barra de status (hora, Wi-Fi, bateria)
// O navegador não informa a potência do Wi-Fi: as barras mostram a qualidade da
// conexão com o SERVIDOR (tempo de resposta), que é o que importa para o coletor.
let conectado = true;
function sinalWifi(ms) {
  conectado = ms !== null;
  const barras = ms === null ? 0 : ms < 150 ? 4 : ms < 400 ? 3 : ms < 1000 ? 2 : 1;
  const icone = $("iconeWifi");
  icone.querySelectorAll(".arco").forEach((a) => (a.style.opacity = Number(a.classList[1].slice(1)) < barras ? 1 : 0.25));
  icone.querySelector(".corte").style.display = conectado ? "none" : "";
  icone.className = !conectado ? "off" : barras <= 2 ? "baixo" : "";
  icone.title = conectado ? `Servidor respondeu em ${ms} ms` : "Sem conexão com o servidor";
}
// Hora do SERVIDOR (o relógio do coletor pode estar errado), andando com o relógio local
let diferencaRelogio = 0;
async function medirServidor() {
  const inicio = performance.now();
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    const s = await r.json();
    const ms = Math.round(performance.now() - inicio);
    diferencaRelogio = new Date(s.data_hora.replace(" ", "T")).getTime() + ms / 2 - Date.now();
    sinalWifi(ms);
  } catch { sinalWifi(null); }
  mostrarHora();
}
function mostrarHora() {
  const d = new Date(Date.now() + diferencaRelogio);
  $("hora").textContent = d.toTimeString().slice(0, 5);
}
setInterval(mostrarHora, 5000);
setInterval(medirServidor, 10000);
window.addEventListener("online", medirServidor);
window.addEventListener("offline", () => sinalWifi(null));
medirServidor();

// Bateria (Chrome: só em origem segura; sem permissão o ícone fica escondido)
navigator.getBattery?.().then((b) => {
  const mostrar = () => {
    const pct = Math.round(b.level * 100);
    $("bateria").hidden = false;
    $("bateriaPct").textContent = pct + "%";
    $("bateriaNivel").setAttribute("width", Math.max(1, 16 * b.level));
    $("bateriaNivel").style.fill = pct <= 15 && !b.charging ? "#ef5350" : "currentColor";
    $("bateriaRaio").style.display = b.charging ? "" : "none";
  };
  mostrar();
  b.addEventListener("levelchange", mostrar);
  b.addEventListener("chargingchange", mostrar);
}).catch(() => {});

// A barra só aparece em tela cheia (fora dela o Android já mostra a dele)
function atualizarTelaCheia() {
  const cheia = !!document.fullscreenElement || matchMedia("(display-mode: fullscreen)").matches;
  document.documentElement.classList.toggle("tela-cheia", cheia);
  $("btTelaCheia").hidden = cheia || instaladoComoApp() || !querTelaCheia;
}
document.addEventListener("fullscreenchange", atualizarTelaCheia);
atualizarTelaCheia();

// ======================================================================= botão ⚙ (servidor)
// A página é servida pelo próprio servidor: trocar o endereço = abrir o /m do outro PC.
function configurarServidor() {
  $("edServidor").value = location.origin;
  $("dlgInfo").textContent = "Conectado agora em " + location.host;
  $("edTelaCheia").checked = querTelaCheia;
  $("edTelaCheia").closest("label").hidden = !!app;
  $("dlgInstalar").textContent = app ? "Aberto no app Coletor WMS."
    : instaladoComoApp() ? "Aberto como app: sem barra do Chrome."
    : "Dica: para a barra do Chrome não voltar nunca, instale como app (menu ⋮ do Chrome → Instalar app / Adicionar à tela inicial). Veja o README.";
  $("dlgServidor").showModal();
  $("edServidor").focus();
}
$("btConfig").addEventListener("click", (ev) => {
  ev.stopPropagation();
  if (window.ColetorApp) window.ColetorApp.servidor();   // popup nativo do app (guarda o endereço)
  else configurarServidor();
});
$("dlgCancelar").addEventListener("click", () => $("dlgServidor").close());
$("formServidor").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  let url = $("edServidor").value.trim().replace(/\/+$/, "");
  if (url && !/^https?:\/\//i.test(url)) url = "http://" + url;
  querTelaCheia = $("edTelaCheia").checked;
  try { localStorage.setItem("coletor.telaCheia", querTelaCheia ? "1" : "0"); } catch {}
  if (querTelaCheia) entrarTelaCheia(); else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  atualizarTelaCheia();
  $("dlgServidor").close();
  if (!url || url === location.origin) {
    try { await api("GET", "/api/status"); msg("Servidor OK: " + location.host, "ok"); } catch (e) { msg(e.message, "erro"); }
    return;
  }
  msg("Abrindo " + url + " …", "info", false);
  location.href = url + "/m";   // o Chrome guarda este endereço; use "Adicionar à tela inicial" de novo se quiser o atalho
});
$("dlgServidor").addEventListener("close", () => setTimeout(focarLeitura, 50));

// ======================================================================= dados de apoio
let produtos = [], enderecos = [], motivos = [];
async function carregarApoio() {
  [produtos, enderecos, motivos] = await Promise.all([api("GET", "/api/produtos"), api("GET", "/api/enderecos"),
    api("GET", "/api/status").then((s) => s.motivos)]);
  enderecos = enderecos.filter((e) => e.ativo);
}
const buscarProduto = (codigo) => api("GET", "/api/produtos/busca?codigo=" + encodeURIComponent(codigo));
const docaId = () => (enderecos.find((e) => e.tipo === "RECEBIMENTO") || {}).id;
const opcoesEndereco = (selecionado) => enderecos.map((e) =>
  `<option value="${e.id}" ${e.id === selecionado ? "selected" : ""}>${esc(e.codigo)}${e.tipo !== "ARMAZENAGEM" ? " (" + e.tipo.toLowerCase() + ")" : ""}</option>`).join("");
const seloValidade = (v) => {
  if (!v) return "";
  const dias = Math.round((new Date(v) - new Date(new Date().toISOString().slice(0, 10))) / 86400000);
  return dias < 0 ? `<span class="selo perigo">vencido</span>` : dias <= 30 ? `<span class="selo alerta">vence em ${dias}d</span>` : "";
};
function cartaoProduto(p, trocar = true) {
  return p ? `<div class="card"><h2>Produto ${trocar ? `<span class="dir"><button class="link" data-acao="trocarProduto">trocar</button></span>` : ""}</h2>
      <div class="produto">${esc(p.sku)}</div><div>${esc(p.descricao)} <span class="fraco">· ${esc(p.unidade)}</span></div></div>`
    : `<div class="dica">Bipe o <b>código de barras</b> do produto</div>`;
}

telas.entrada = {
  titulo: "Recebimento",
  abrir() { this.produto = null; this.tags = new Map(); this.desenhar(); },
  desenhar() {
    const p = this.produto;
    definirGatilho(p ? "rfid" : "barras");   // primeiro bipa o produto, depois lê as etiquetas
    tela.innerHTML = cartaoProduto(p) + (p ? `
      <div class="card">
        <div class="duas">
          <label class="campo"><span>Lote</span><input id="enLote" list="enLotes" autocapitalize="characters" enterkeyhint="next" autocomplete="off" style="text-transform:uppercase"></label>
          <label class="campo"><span>Validade</span><input id="enValidade" type="date"></label>
        </div>
        <datalist id="enLotes">${p.lotes.map((l) => `<option value="${esc(l.lote)}">`).join("")}</datalist>
        <div class="duas">
          <label class="campo"><span>Endereço</span><select id="enEndereco">${opcoesEndereco(docaId())}</select></label>
          <label class="campo"><span>Nota fiscal</span><input id="enDoc"></label>
        </div>
        <label class="campo"><span>Quantidade (sem RFID)</span><input id="enQtd" inputmode="decimal" enterkeyhint="done" data-enter="registrar" placeholder="ou leia as etiquetas RFID"></label>
      </div>
      <div class="card"><h2>Etiquetas RFID <span class="dir"><span class="contador" id="enCont">0</span></span></h2>
        <ul class="lista" id="enTags"></ul></div>
      <div class="botoes"><button class="b" data-acao="limpar">Limpar</button><button class="b primario" data-acao="registrar" id="enBotao">Registrar entrada</button></div>` : "");
    if (p) {
      $("enLote").addEventListener("change", () => {
        const l = p.lotes.find((x) => x.lote === $("enLote").value.trim().toUpperCase());
        if (l) { if (l.validade) $("enValidade").value = l.validade; $("enEndereco").value = l.endereco_id; msg(`Lote ${l.lote} já existe: soma no saldo (${num(l.quantidade)})`, "info", false); }
      });
      this.desenharTags();
    }
  },
  desenharTags() {
    const novas = [...this.tags.values()].filter((t) => t.ok).length;
    $("enCont").textContent = novas;
    $("enTags").innerHTML = [...this.tags.values()].reverse().map((t) => `<li class="${t.ok ? "" : "erro"}">
        <div class="info"><div class="mono">${esc(t.epc)}</div><div class="fraco">${esc(t.info)}</div></div>
        <button class="x" data-acao="removerTag" data-valor="${esc(t.epc)}">✕</button></li>`).join("")
      || `<li class="vazio">Aperte o gatilho perto das etiquetas</li>`;
    $("enBotao").textContent = novas ? `Registrar ${novas} etiqueta(s)` : "Registrar entrada";
  },
  async codigo(c) {
    await executar(null, async () => {
      if (this.produto && this.tags.size) throw new Error("Envie ou limpe as etiquetas antes de trocar de produto");
      const p = await buscarProduto(c);
      if (!p.ativo) throw new Error(`Produto ${p.sku} está inativo`);
      this.produto = p; this.tags = new Map();
      this.desenhar(); msg(`${p.sku} · ${p.descricao}`, "ok");
      digitar($("enLote"));
    });
  },
  async rfid(epc) {
    if (!this.produto) return msg("Bipe primeiro o código de barras do produto", "alerta");
    if (this.tags.has(epc)) return;
    const t = { epc, ok: true, info: "nova" };
    this.tags.set(epc, t); this.desenharTags(); bipe("ok");
    try {
      const tag = await api("GET", "/api/tags/" + encodeURIComponent(epc));
      if (tag.status === "ATIVA") { t.ok = false; t.info = `já em estoque: ${tag.sku} lote ${tag.lote}`; bipe("erro"); }
      else t.info = `reaproveitada (era ${tag.sku})`;
    } catch { /* tag nunca usada: nova */ }
    if (telaAtual === "entrada") this.desenharTags();
  },
  endereco(e) { if (this.produto) { $("enEndereco").value = e.id; msg("Endereço " + e.codigo, "info"); } },
  removerTag(_b, epc) { this.tags.delete(epc); this.desenharTags(); },
  trocarProduto() { if (this.tags.size) return msg("Envie ou limpe as etiquetas antes", "alerta"); this.abrir(); },
  limpar() { this.abrir(); msg(""); },
  async registrar() {
    const b = $("enBotao");
    const epcs = [...this.tags.values()].filter((t) => t.ok).map((t) => t.epc);
    const qtd = numero($("enQtd").value);
    if (!epcs.length && !(qtd > 0)) return msg("Leia as etiquetas RFID ou informe a quantidade", "alerta");
    if (!$("enLote").value.trim()) return msg("Informe o lote", "alerta");
    await executar(b, async () => {
      const r = await api("POST", "/api/entradas", {
        produto_id: this.produto.id, lote: $("enLote").value, validade: $("enValidade").value || null,
        quantidade: epcs.length ? 0 : qtd, epcs, endereco_id: Number($("enEndereco").value) || null,
        documento: $("enDoc").value, origem: "COLETOR", meio: epcs.length ? "RFID" : "BARRAS",
      });
      this.abrir();
      msg(`OK: entrada de ${num(r.quantidade)} ${r.sku}\nLote ${r.lote} em ${r.endereco} · saldo ${num(r.saldo)}` +
        (r.avisos.length ? "\n⚠ " + r.avisos.join("\n⚠ ") : ""), r.avisos.length ? "alerta" : "ok");
    });
  },
};

    const corpo = $("bxCorpo");
    if (this.produto) {
      corpo.innerHTML = cartaoProduto(this.produto) + `<div class="card">
          <label class="campo"><span>Quantidade (sai por FEFO)</span><input id="bxQtd" inputmode="decimal" enterkeyhint="done" data-enter="baixarQtd"></label>
          <div id="bxPrevia" class="fraco"></div></div>
        <div class="botoes"><button class="b" data-acao="limpar">Limpar</button><button class="b perigo" data-acao="baixarQtd" id="bxBotao">Baixar</button></div>`;
      $("bxQtd").addEventListener("input", () => { clearTimeout(this.t); this.t = setTimeout(() => this.previa(), 300); });
      digitar($("bxQtd"));
    } else if (this.tags.size) {
      const validas = [...this.tags.values()].filter((t) => t.ok).length;
      corpo.innerHTML = `<div class="card"><h2>Etiquetas lidas <span class="dir"><span class="contador">${validas}</span></span></h2>
          <ul class="lista">${[...this.tags.values()].reverse().map((t) => `<li class="${t.ok ? "" : "erro"}">
            <div class="info"><div>${esc(t.info)}</div><div class="mono fraco">${esc(t.epc)}</div></div>
            <button class="x" data-acao="removerTag" data-valor="${esc(t.epc)}">✕</button></li>`).join("")}</ul>
          <p class="fraco">Confira a lista: tag lida por engano pode ser removida no ✕ antes de baixar.</p></div>
        <div class="botoes"><button class="b" data-acao="limpar">Limpar</button><button class="b perigo" data-acao="baixarTags" id="bxBotao" ${validas ? "" : "disabled"}>Baixar ${validas} tag(s)</button></div>`;
    } else {
      corpo.innerHTML = `<div class="dica">Aperte o gatilho perto das <b>etiquetas RFID</b><br>ou bipe o <b>código de barras</b> do produto</div>`;
    }
  },
  async previa() {
    const q = numero($("bxQtd")?.value);
    if (!(q > 0)) { $("bxPrevia").textContent = ""; return; }
    try {
      const plano = await api("GET", `/api/fefo?produto_id=${this.produto.id}&quantidade=${q}&motivo=${$("bxMotivo").value}`);
      $("bxPrevia").innerHTML = "Sai de: " + plano.map((l) => `<b>${num(l.quantidade)}</b> do lote ${esc(l.lote)} em <b>${esc(l.endereco)}</b>`).join(", ");
    } catch (e) { $("bxPrevia").innerHTML = `<span style="color:var(--perigo)">${esc(e.message)}</span>`; }
  },
  async codigo(c) {
    if (this.tags.size) return msg("Baixe ou limpe as etiquetas lidas antes", "alerta");
    await executar(null, async () => { this.produto = await buscarProduto(c); this.desenhar(); msg(`${this.produto.sku} · informe a quantidade`, "info"); });
  },
  async rfid(epc) {
    if (this.produto) return msg("Termine a baixa por quantidade ou toque em Limpar", "alerta");
    if (this.tags.has(epc)) return;
    const t = { epc, ok: false, info: "consultando…" };
    this.tags.set(epc, t); this.desenhar();
    try {
      const tag = await api("GET", "/api/tags/" + encodeURIComponent(epc));
      t.ok = tag.status === "ATIVA";
      t.info = `${tag.sku} · lote ${tag.lote}` + (t.ok ? "" : " · JÁ BAIXADA");
      bipe(t.ok ? "ok" : "erro");
    } catch { t.info = "tag não cadastrada"; bipe("erro"); }
    if (telaAtual === "baixa") this.desenhar();
  },
  removerTag(_b, epc) { this.tags.delete(epc); this.desenhar(); },
  trocarProduto() { this.produto = null; this.desenhar(); },
  limpar() { this.produto = null; this.tags = new Map(); this.desenhar(); msg(""); },
  async baixarQtd() {
    const q = numero($("bxQtd").value);
    if (!(q > 0)) return msg("Informe a quantidade", "alerta");
    await executar($("bxBotao"), async () => {
      const r = await api("POST", "/api/baixas", { produto_id: this.produto.id, quantidade: q, motivo: $("bxMotivo").value,
        documento: $("bxDoc").value, origem: "COLETOR", meio: "BARRAS" });
      this.limpar();
      msg("OK: baixa por FEFO\n" + r.lotes.map((l) => `${num(l.quantidade)} do lote ${l.lote} (${l.endereco})`).join("\n"));
    });
  },
  async baixarTags() {
    const epcs = [...this.tags.values()].filter((t) => t.ok).map((t) => t.epc);
    await executar($("bxBotao"), async () => {
      const r = await api("POST", "/api/baixas", { epcs, motivo: $("bxMotivo").value, documento: $("bxDoc").value, origem: "COLETOR", meio: "RFID" });
      const ok = r.tags.filter((t) => t.ok), erros = r.tags.filter((t) => !t.ok);
      const avisos = [...new Set(ok.flatMap((t) => t.avisos))];
      this.limpar();
      msg(`OK: ${ok.length} de ${r.tags.length} tag(s) baixada(s)` + erros.map((t) => `\n✕ ${t.epc}: ${t.erro}`).join("") +
        avisos.map((a) => "\n⚠ " + a).join(""), erros.length ? "erro" : avisos.length ? "alerta" : "ok");
    });
  },
};

// ======================================================================= SEPARAÇÃO (pedidos)
telas.separacao = {
  titulo: "Separação",
  gatilho: "barras",
  async abrir() {
    this.pedido = null;
    tela.innerHTML = `<div class="card"><h2>Pedidos em aberto</h2><ul class="lista" id="spLista"><li class="vazio">Carregando…</li></ul></div>`;
    try {
      const lista = (await api("GET", "/api/pedidos")).filter((p) => ["ABERTO", "SEPARANDO"].includes(p.status));
      if (telaAtual !== "separacao" || !$("spLista")) return;
      $("spLista").innerHTML = lista.map((p) => `<li class="clicavel" data-acao="abrirPedido" data-valor="${p.id}">
          <div class="info"><b>${esc(p.numero)}</b> · ${esc(p.cliente)}<div class="fraco">${p.itens} item(ns) · ${num(p.unidades)} un.</div></div>
          <span class="selo ${p.status === "SEPARANDO" ? "alerta" : "info"}">${p.status === "SEPARANDO" ? "separando" : "aberto"}</span></li>`).join("")
        || `<li class="vazio">Nenhum pedido em aberto. Crie os pedidos no PC.</li>`;
    } catch (e) { msg(e.message, "erro"); }
  },
  async abrirPedido(_b, id) {
    await executar(null, async () => {
      const d = await api("GET", "/api/pedidos/" + id);
      if (!this.pedido || this.pedido.pedido.id !== d.pedido.id) this.conferidos = new Set();
      this.pedido = d;
      const p = d.pedido;
      if (p.status === "ABERTO") {
        tela.innerHTML = `<div class="card"><div class="produto">${esc(p.numero)}</div><div>${esc(p.cliente)}</div></div>
          <div class="card"><h2>Itens</h2><ul class="lista">${d.itens.map((i) => `<li><div class="info"><b>${esc(i.sku)}</b><div class="fraco">${esc(i.descricao)}</div></div><span class="qtd">${num(i.quantidade)} ${esc(i.unidade)}</span></li>`).join("")}</ul></div>
          <div class="botoes"><button class="b primario" data-acao="liberar" id="spBotao">Liberar e separar</button></div>`;
        return;
      }
      this.desenharSeparacao();
    });
  },
  desenharSeparacao() {
    const d = this.pedido, total = d.separacao.length, feitos = this.conferidos.size;
    tela.innerHTML = `<div class="card"><h2>${esc(d.pedido.numero)} · ${esc(d.pedido.cliente)} <span class="dir"><span class="contador">${feitos}/${total}</span></span></h2>
        <p class="fraco" style="margin:0">Vá até o endereço, pegue a quantidade e <b>bipe o produto</b> (ou toque na linha).</p></div>
      <div class="card"><ul class="lista">${d.separacao.map((s, i) => `<li class="clicavel ${this.conferidos.has(i) ? "ok" : ""}" data-acao="alternar" data-valor="${i}">
          <span class="check">${this.conferidos.has(i) ? "✓" : ""}</span>
          <div class="info"><b style="font-size:17px">${esc(s.endereco)}</b><div><b>${esc(s.sku)}</b> · lote ${esc(s.lote)}</div><div class="fraco">${esc(s.descricao)} · val. ${dataBR(s.validade)}</div></div>
          <span class="qtd">${num(s.quantidade)} ${esc(s.unidade)}</span></li>`).join("")}</ul></div>
      <div class="botoes"><button class="b" data-acao="abrir">Pedidos</button>
        <button class="b sucesso" data-acao="expedir" id="spBotao" ${feitos < total ? "disabled" : ""}>Confirmar expedição</button></div>`;
  },
  alternar(_b, i) {
    i = Number(i);
    if (this.conferidos.has(i)) this.conferidos.delete(i); else this.conferidos.add(i);
    this.desenharSeparacao();
  },
  async codigo(c) {
    if (!this.pedido || this.pedido.pedido.status !== "SEPARANDO") return msg("Abra um pedido em separação", "alerta");
    await executar(null, async () => {
      const p = await buscarProduto(c);
      const i = this.pedido.separacao.findIndex((s, n) => s.sku === p.sku && !this.conferidos.has(n));
      if (i < 0) {
        const tem = this.pedido.separacao.some((s) => s.sku === p.sku);
        throw new Error(tem ? `${p.sku} já foi todo conferido` : `${p.sku} NÃO está neste pedido`);
      }
      this.conferidos.add(i);
      this.desenharSeparacao();
      const s = this.pedido.separacao[i];
      msg(`✓ ${s.sku}: ${num(s.quantidade)} ${s.unidade} do lote ${s.lote}`);
    });
  },
  async liberar() {
    await executar($("spBotao"), async () => {
      await api("POST", `/api/pedidos/${this.pedido.pedido.id}/liberar`);
      await this.abrirPedido(null, this.pedido.pedido.id);
      msg("Estoque reservado por FEFO. Siga a lista de separação.");
    });
  },
  async expedir() {
    await executar($("spBotao"), async () => {
      const r = await api("POST", `/api/pedidos/${this.pedido.pedido.id}/expedir`);
      await this.abrir();
      msg(`OK: pedido ${r.numero} expedido`);
    });
  },
};

// ======================================================================= INVENTÁRIO
telas.inventario = {
  titulo: "Inventário",
  async abrir() {
    this.tags = new Map(); this.produto = null;
    tela.innerHTML = `<div class="card"><label class="campo"><span>Inventário</span><select id="ivLista"></select></label></div><div id="ivCorpo"></div>`;
    try {
      const abertos = (await api("GET", "/api/inventarios")).filter((i) => i.status === "ABERTO");
      if (telaAtual !== "inventario") return;
      $("ivLista").innerHTML = abertos.map((i) => `<option value="${i.id}">#${i.id} ${esc(i.nome)} (${i.itens} contagens)</option>`).join("");
      if (!abertos.length) { $("ivCorpo").innerHTML = `<div class="dica">Nenhum inventário aberto.<br>Abra um no PC.</div>`; return; }
      this.desenhar();
    } catch (e) { msg(e.message, "erro"); }
  },
  desenhar() {
    const corpo = $("ivCorpo");
    if (!corpo || !$("ivLista").value) return;
    if (this.produto) {
      const lotes = this.produto.lotes;
      corpo.innerHTML = cartaoProduto(this.produto) + `<div class="card">
          <label class="campo"><span>Lote</span><select id="ivLote">${lotes.map((l) => `<option value="${l.id}">${esc(l.lote)} · val. ${dataBR(l.validade)} · ${esc(l.endereco)}</option>`).join("")}</select></label>
          <label class="campo"><span>Quantidade contada</span><input id="ivQtd" inputmode="decimal" enterkeyhint="done" data-enter="contarQtd"></label></div>
        <div class="botoes"><button class="b" data-acao="limpar">Limpar</button><button class="b primario" data-acao="contarQtd" id="ivBotao" ${lotes.length ? "" : "disabled"}>Adicionar contagem</button></div>`;
      if (!lotes.length) msg("Produto sem lote cadastrado: registre a sobra no PC", "alerta");
      else digitar($("ivQtd"));
    } else if (this.tags.size) {
      corpo.innerHTML = `<div class="card"><h2>Etiquetas lidas <span class="dir"><span class="contador">${this.tags.size}</span></span></h2>
          <ul class="lista">${[...this.tags.values()].reverse().slice(0, 100).map((t) => `<li><div class="info"><div>${esc(t.info)}</div><div class="mono fraco">${esc(t.epc)}</div></div></li>`).join("")}</ul></div>
        <div class="botoes"><button class="b" data-acao="limpar">Limpar</button><button class="b primario" data-acao="contarTags" id="ivBotao">Enviar ${this.tags.size} tag(s)</button></div>`;
    } else {
      corpo.innerHTML = `<div class="dica">Passe o coletor com o <b>gatilho apertado</b> pelas etiquetas RFID<br>ou bipe o <b>código de barras</b> e digite a quantidade</div>`;
    }
  },
  rfid(epc) {
    if (!$("ivLista")?.value) return msg("Nenhum inventário aberto", "erro");
    if (this.produto) return msg("Termine a contagem por quantidade ou toque em Limpar", "alerta");
    if (this.tags.has(epc)) return;
    const t = { epc, info: "…" };
    this.tags.set(epc, t);
    clearTimeout(this.t); this.t = setTimeout(() => this.desenhar(), 150);   // leitura em rajada: redesenha uma vez
    api("GET", "/api/tags/" + encodeURIComponent(epc)).then((x) => (t.info = `${x.sku} · lote ${x.lote}`)).catch(() => (t.info = "não cadastrada"))
      .finally(() => { clearTimeout(this.t); this.t = setTimeout(() => telaAtual === "inventario" && this.desenhar(), 150); });
  },
  async codigo(c) {
    if (!$("ivLista")?.value) return msg("Nenhum inventário aberto", "erro");
    if (this.tags.size) return msg("Envie ou limpe as etiquetas lidas antes", "alerta");
    await executar(null, async () => { this.produto = await buscarProduto(c); this.desenhar(); bipe("ok"); });
  },
  trocarProduto() { this.produto = null; this.desenhar(); },
  limpar() { this.tags = new Map(); this.produto = null; this.desenhar(); msg(""); },
  async contarQtd() {
    const q = numero($("ivQtd").value);
    if (!(q >= 0) || $("ivQtd").value.trim() === "") return msg("Informe a quantidade contada", "alerta");
    await executar($("ivBotao"), async () => {
      const r = await api("POST", `/api/inventarios/${$("ivLista").value}/contagens`, { lote_id: Number($("ivLote").value), quantidade: q, origem: "COLETOR", meio: "BARRAS" });
      this.limpar();
      msg(`OK: contado ${num(r.quantidade)} no lote ${r.lote}`);
    });
  },
  async contarTags() {
    await executar($("ivBotao"), async () => {
      const r = await api("POST", `/api/inventarios/${$("ivLista").value}/contagens`, { epcs: [...this.tags.keys()], origem: "COLETOR", meio: "RFID" });
      const novas = r.tags.filter((t) => t.ok && !t.repetida).length, repetidas = r.tags.filter((t) => t.repetida).length;
      const erros = r.tags.filter((t) => !t.ok);
      this.limpar();
      msg(`OK: ${novas} tag(s) contada(s)` + (repetidas ? `\n${repetidas} já tinham sido contadas` : "") +
        erros.map((t) => `\n✕ ${t.epc}: ${t.erro}`).join(""), erros.length ? "alerta" : "ok");
    });
  },
};

// ======================================================================= CONSULTA
telas.consulta = {
  titulo: "Consulta",
  abrir() { tela.innerHTML = `<div class="dica">Leia uma <b>etiqueta RFID</b>, bipe um <b>produto</b><br>ou a <b>etiqueta de um endereço</b></div><div id="csCorpo"></div>`; },
  async rfid(epc) {
    await executar(null, async () => {
      const t = await api("GET", "/api/tags/" + encodeURIComponent(epc));
      $("csCorpo").innerHTML = `<div class="card" style="margin-top:8px"><h2>Etiqueta RFID <span class="dir"><span class="selo ${t.status === "ATIVA" ? "sucesso" : "perigo"}">${t.status === "ATIVA" ? "em estoque" : "baixada"}</span></span></h2>
        <div class="mono">${esc(t.epc)}</div><div class="produto" style="margin-top:6px">${esc(t.sku)}</div><div>${esc(t.descricao)}</div>
        <div>Lote <b>${esc(t.lote)}</b> · validade ${dataBR(t.validade)} ${seloValidade(t.validade)}</div>
        <div>Endereço <b>${esc(t.endereco)}</b> ${t.status_lote === "BLOQUEADO" ? '<span class="selo perigo">lote bloqueado</span>' : ""}</div></div>`;
      bipe("ok");
    });
  },
  async codigo(c) {
    await executar(null, async () => {
      const p = await buscarProduto(c);
      const lotes = p.lotes.filter((l) => l.quantidade > 0);
      const total = lotes.reduce((s, l) => s + l.quantidade, 0);
      $("csCorpo").innerHTML = `<div class="card" style="margin-top:8px"><h2>Produto <span class="dir"><span class="contador">${num(total)}</span> ${esc(p.unidade)}</span></h2>
        <div class="produto">${esc(p.sku)}</div><div>${esc(p.descricao)}</div><div class="fraco">EAN ${esc(p.ean || "-")} · mínimo ${num(p.estoque_min)}</div>
        <ul class="lista" style="margin-top:6px">${lotes.map((l) => `<li><div class="info"><b>${esc(l.endereco)}</b> · lote ${esc(l.lote)} ${seloValidade(l.validade)}
          ${l.status === "BLOQUEADO" ? '<span class="selo perigo">bloqueado</span>' : ""}<div class="fraco">val. ${dataBR(l.validade)}</div></div><span class="qtd">${num(l.quantidade)}</span></li>`).join("")
          || '<li class="vazio">Sem saldo</li>'}</ul></div>`;
      bipe("ok");
    });
  },
  async endereco(e) {
    await executar(null, async () => {
      const lotes = (await api("GET", "/api/estoque")).filter((l) => l.lote_id && l.endereco === e.codigo);
      $("csCorpo").innerHTML = `<div class="card" style="margin-top:8px"><h2>Endereço <span class="dir"><span class="selo info">${esc(e.tipo.toLowerCase())}</span></span></h2>
        <div class="produto">${esc(e.codigo)}</div><div class="fraco">${esc(e.descricao || "")}</div>
        <ul class="lista" style="margin-top:6px">${lotes.map((l) => `<li><div class="info"><b>${esc(l.sku)}</b> · lote ${esc(l.lote)} ${seloValidade(l.validade)}<div class="fraco">${esc(l.descricao)}</div></div><span class="qtd">${num(l.quantidade)}</span></li>`).join("")
          || '<li class="vazio">Endereço vazio</li>'}</ul></div>`;
      bipe("ok");
    });
  },
};

  try { await carregarApoio(); } catch (e) { msg(e.message, "erro"); }
  abrir(location.hash.slice(1) || "menu");
  setInterval(() => carregarApoio().catch(() => {}), 60000);
})();
